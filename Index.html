<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift">
<title>Lift</title>
<style>
:root {
  --bg:#0d0d0f;--bg2:#16161a;--bg3:#1e1e24;--bg4:#26262e;--bg5:#2e2e38;
  --border:#2e2e38;--border2:#3a3a48;
  --text:#f0f0f4;--text2:#a0a0b0;--text3:#606078;
  --accent:#e0ff4f;--accent-dim:rgba(224,255,79,0.12);--accent-dim2:rgba(224,255,79,0.05);
  --red:#ff5c5c;--red-dim:rgba(255,92,92,0.12);
  --blue:#4fa8ff;--blue-dim:rgba(79,168,255,0.14);
  --green:#4fff9a;
  --radius:14px;--radius-sm:9px;--radius-xs:6px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="light"]{
  --bg:#f2f2f7;--bg2:#fff;--bg3:#f5f5fa;--bg4:#eaeaf0;--bg5:#e0e0ea;
  --border:#d8d8e8;--border2:#c8c8d8;
  --text:#0d0d14;--text2:#5a5a70;--text3:#9090a8;
  --accent:#5a9400;--accent-dim:rgba(90,148,0,0.1);--accent-dim2:rgba(90,148,0,0.05);
  --red:#cc2020;--red-dim:rgba(204,32,32,0.1);
  --blue:#0060cc;--blue-dim:rgba(0,96,204,0.1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg);color:var(--text)}
#app{display:flex;flex-direction:column;height:100%}
#view{flex:1;overflow-y:auto;padding-bottom:calc(64px + var(--safe-b));padding-top:var(--safe-t)}
#view::-webkit-scrollbar{display:none}

/* TAB BAR */
#tabbar{position:fixed;bottom:0;left:0;right:0;height:calc(64px + var(--safe-b));background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:8px;padding-bottom:var(--safe-b);z-index:100}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;color:var(--text3);transition:color .15s}
.tab.active{color:var(--accent)}
.tab svg{width:22px;height:22px}
.tab span{font-size:10px;font-weight:600;letter-spacing:.02em}

/* REST BANNER */
#rest-banner{position:sticky;top:0;z-index:50;background:var(--bg2);border-bottom:1px solid var(--border);display:none;align-items:center;gap:12px;padding:10px 16px}
#rest-banner.visible{display:flex}
.rb-info{flex-shrink:0}
.rb-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em}
.rb-time{font-size:28px;font-weight:700;color:var(--accent);letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.rb-bar-wrap{flex:1;height:4px;background:var(--bg4);border-radius:2px;overflow:hidden}
.rb-bar{height:100%;background:var(--accent);border-radius:2px;transition:width 1s linear}
.rb-skip{padding:8px 16px;background:var(--accent);border-radius:20px;font-size:13px;font-weight:700;color:#000;cursor:pointer;white-space:nowrap}
.rb-add{padding:8px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer}

/* PAGE */
.page-header{padding:20px 20px 12px}
.page-title{font-size:28px;font-weight:700;letter-spacing:-.5px}
.page-subtitle{font-size:14px;color:var(--text2);margin-top:2px}
.section-label{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:4px 20px 8px}
.stat-row{display:flex;gap:10px;padding:0 16px 14px}
.stat-pill{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;text-align:center}
.stat-pill .sv{font-size:22px;font-weight:700}
.stat-pill .sl{font-size:11px;color:var(--text2);margin-top:2px}

/* DAY CARDS */
.day-card{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);margin:0 16px 10px;padding:16px;cursor:pointer;transition:border-color .15s}
.day-card:active{background:var(--bg3)}
.day-card.today{border-color:var(--accent)}
.day-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.day-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.day-label.today-lbl{color:var(--accent)}
.day-name{font-size:19px;font-weight:700;letter-spacing:-.3px}
.day-ex{font-size:13px;color:var(--text2);margin-top:3px;line-height:1.45}
.day-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.day-badge.lift{background:var(--accent-dim);color:var(--accent)}
.day-badge.run{background:var(--blue-dim);color:var(--blue)}

/* WORKOUT HEADER */
.wk-header{padding:14px 16px 10px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--border)}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.back-btn svg{width:18px;height:18px}
.wk-title-wrap{flex:1;min-width:0}
.wk-main-title{font-size:20px;font-weight:700;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-day-label{font-size:13px;color:var(--text2)}
.wk-timer{font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-dim);padding:5px 11px;border-radius:20px;flex-shrink:0;font-variant-numeric:tabular-nums}

/* EXERCISE BLOCK */
.ex-block{margin:12px 16px 0;background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.ex-header{padding:14px 16px 10px;display:flex;align-items:flex-start;gap:8px}
.ex-header-info{flex:1;min-width:0}
.ex-name{font-size:16px;font-weight:700}
.ex-meta{font-size:12px;color:var(--text3);margin-top:3px}
.ex-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{width:32px;height:32px;border-radius:var(--radius-xs);background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn svg{width:15px;height:15px;color:var(--text2)}
.icon-btn.danger svg{color:var(--red)}

/* PREV BANNER */
.prev-banner{padding:9px 16px;background:var(--bg3);border-top:1px solid var(--border)}
.prev-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.prev-chips{display:flex;gap:6px;flex-wrap:wrap}
.prev-chip{font-size:12px;color:var(--text2);background:var(--bg4);padding:3px 8px;border-radius:20px}

/* SETS */
.sets-head{display:grid;grid-template-columns:28px 1fr 1fr 38px 28px;gap:6px;padding:8px 16px 5px}
.sets-head span{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;text-align:center}
.sets-head span:first-child{text-align:left}
.set-row{display:grid;grid-template-columns:28px 1fr 1fr 38px 28px;gap:6px;padding:5px 16px;align-items:center;transition:background .1s}
.set-row.done-row{background:var(--accent-dim2)}
.set-num{font-size:13px;font-weight:700;color:var(--text3)}
.set-inp{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-xs);padding:8px 4px;text-align:center;font-size:16px;font-weight:700;color:var(--text);width:100%;-webkit-appearance:none;font-family:inherit}
.set-inp:focus{outline:none;border-color:var(--accent);background:var(--bg2)}
.set-inp[readonly]{opacity:.45;pointer-events:none}
.tick-btn{width:34px;height:34px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0}
.tick-btn.done{background:var(--accent);border-color:var(--accent)}
.tick-btn svg{width:16px;height:16px;color:var(--text3)}
.tick-btn.done svg{color:#000}
.del-set-btn{width:26px;height:26px;border-radius:50%;background:transparent;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.35}
.del-set-btn:active{opacity:1}
.del-set-btn svg{width:14px;height:14px;color:var(--red)}
.add-set-row{padding:10px 16px 14px;text-align:center;font-size:13px;font-weight:700;color:var(--text3);cursor:pointer;border-top:1px solid var(--border)}
.add-set-row:active{background:var(--bg3)}
.finish-btn{margin:14px 16px 6px;padding:16px;background:var(--accent);border-radius:var(--radius);text-align:center;font-size:17px;font-weight:800;color:#000;cursor:pointer}
.finish-btn:active{opacity:.85}

/* LIBRARY */
.routine-card{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);margin:0 16px 10px;padding:16px;cursor:pointer}
.routine-card:active{background:var(--bg3)}
.routine-card-top{display:flex;align-items:center;justify-content:space-between}
.routine-name{font-size:17px;font-weight:700}
.routine-meta{font-size:13px;color:var(--text2);margin-top:4px}
.routine-actions{display:flex;gap:8px}
.new-routine-btn{margin:0 16px 14px;padding:14px;border:2px dashed var(--border2);border-radius:var(--radius);text-align:center;font-size:15px;font-weight:700;color:var(--text3);cursor:pointer}
.new-routine-btn:active{background:var(--bg2)}

/* RUN LOGGER */
.run-block{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);margin:0 16px 12px;padding:18px}
.run-time-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.run-dist-row{margin-top:12px}
.run-field label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;display:block;margin-bottom:6px;text-align:center}
.run-inp{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 4px;font-size:28px;font-weight:800;color:var(--text);width:100%;text-align:center;-webkit-appearance:none;font-family:inherit;font-variant-numeric:tabular-nums}
.run-inp:focus{outline:none;border-color:var(--blue)}
.run-inp.dist{font-size:32px}
.log-run-btn{margin-top:14px;padding:14px;background:var(--blue);border-radius:var(--radius-sm);text-align:center;font-size:16px;font-weight:800;color:#fff;cursor:pointer}
.log-run-btn:active{opacity:.85}

/* HISTORY */
.filter-tabs{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto}
.filter-tabs::-webkit-scrollbar{display:none}
.ftab{padding:7px 14px;border-radius:20px;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;background:var(--bg2);border:1px solid var(--border);color:var(--text2)}
.ftab.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.hist-session{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin:0 16px 10px;overflow:hidden}
.hist-sess-hdr{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.hist-sess-title{font-size:15px;font-weight:700}
.hist-sess-date{font-size:12px;color:var(--text2)}
.hist-sess-body{padding:0 16px 14px;display:none}
.hist-sess-body.open{display:block}
.hist-ex-name{font-size:13px;font-weight:700;color:var(--text2);margin:10px 0 3px}
.hist-set-line{font-size:13px;color:var(--text3);padding:1px 0}
.chevron{transition:transform .2s}
.chevron.open{transform:rotate(180deg)}
.run-hist-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin:0 16px 10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.rhi-left .rhi-date{font-size:12px;color:var(--text2)}
.rhi-left .rhi-name{font-size:15px;font-weight:700;margin-top:2px}
.rhi-right{text-align:right}
.rhi-dist{font-size:20px;font-weight:800;color:var(--blue)}
.rhi-time{font-size:13px;color:var(--text2)}

/* CALENDAR */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:0 20px 12px}
.cal-nav-btn{width:36px;height:36px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer}
.cal-nav-btn svg{width:18px;height:18px}
.cal-month{font-size:17px;font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 16px 12px}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--text3);padding:4px 0}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--radius-xs);font-size:14px;font-weight:600;color:var(--text2);gap:2px}
.cal-day.today-cal{background:var(--accent-dim);color:var(--accent)}
.cal-day.other-month{opacity:.25}
.cal-dot{width:5px;height:5px;border-radius:50%}
.cal-dot.lift-dot{background:var(--accent)}
.cal-dot.run-dot{background:var(--blue)}

/* SETTINGS */
.settings-group{margin:0 16px 12px;background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.settings-group-lbl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:14px 16px 8px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-top:1px solid var(--border)}
.settings-lbl{font-size:15px;font-weight:500}
.s-inp{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-xs);padding:6px 10px;font-size:15px;color:var(--text);width:80px;text-align:center;-webkit-appearance:none;font-family:inherit}
.s-inp:focus{outline:none;border-color:var(--accent)}
.theme-picker{display:flex;gap:8px}
.theme-opt{padding:6px 12px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;background:var(--bg3);border:1px solid var(--border);color:var(--text2)}
.theme-opt.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.danger-lbl{color:var(--red)}

/* EDIT DAY */
.edit-ex-row{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin:0 16px 8px;display:flex;align-items:center;gap:10px;padding:12px 14px}
.drag-handle{color:var(--text3);cursor:grab;flex-shrink:0}
.drag-handle svg{width:18px;height:18px}
.edit-ex-info{flex:1;min-width:0}
.edit-ex-name{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main-toggle{font-size:11px;font-weight:700;padding:3px 8px;border-radius:12px;cursor:pointer;border:1px solid;background:transparent}
.main-toggle.is-main{color:var(--accent);border-color:var(--accent)}
.main-toggle.not-main{color:var(--text3);border-color:var(--text3)}
.rest-inline{width:52px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-xs);padding:4px 6px;font-size:13px;color:var(--text);text-align:center;font-family:inherit;-webkit-appearance:none}

/* MODALS */
.modal-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.7);display:none;align-items:flex-end}
.modal-overlay.visible{display:flex}
.modal-sheet{background:var(--bg2);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-height:82vh;display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
.modal-hdr{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.modal-title{font-size:17px;font-weight:800}
.modal-close{width:30px;height:30px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;cursor:pointer}
.modal-close svg{width:16px;height:16px}
.modal-search{margin:10px 16px;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;color:var(--text);width:calc(100% - 32px);-webkit-appearance:none;font-family:inherit}
.modal-search:focus{outline:none;border-color:var(--accent)}
.modal-list{overflow-y:auto;flex:1}
.modal-list::-webkit-scrollbar{display:none}
.modal-item{padding:14px 16px;border-bottom:1px solid var(--border);font-size:15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.modal-item:active{background:var(--bg3)}
.modal-item-meta{font-size:12px;color:var(--text3)}
.modal-add-row{padding:12px 16px;display:flex;gap:8px;border-top:1px solid var(--border)}
.modal-add-inp{flex:1;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-xs);font-size:15px;color:var(--text);-webkit-appearance:none;font-family:inherit}
.modal-add-inp:focus{outline:none;border-color:var(--accent)}
.modal-add-btn{padding:10px 16px;background:var(--accent);border-radius:var(--radius-xs);font-size:15px;font-weight:800;color:#000;cursor:pointer;white-space:nowrap}

/* ROUTINE BUILDER */
.routine-builder{background:var(--bg2);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-height:92vh;display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
.rb-ex-list{overflow-y:auto;flex:1;padding:8px 0}
.rb-ex-list::-webkit-scrollbar{display:none}
.rb-ex-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.rb-ex-name{flex:1;font-size:15px;font-weight:600}
.rb-rm-btn{width:28px;height:28px;border-radius:50%;background:var(--red-dim);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.rb-rm-btn svg{width:14px;height:14px;color:var(--red)}
.rb-save-btn{margin:12px 16px;padding:14px;background:var(--accent);border-radius:var(--radius-sm);text-align:center;font-size:16px;font-weight:800;color:#000;cursor:pointer}

/* DONE MODAL */
.done-modal{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center}
.done-modal.visible{display:flex}
.done-card{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);padding:32px 24px;text-align:center;max-width:320px;width:calc(100% - 48px)}
.done-emoji{font-size:52px;margin-bottom:12px}
.done-title{font-size:24px;font-weight:800;margin-bottom:8px}
.done-stats{font-size:15px;color:var(--text2);margin-bottom:24px;line-height:1.7}
.done-btn{padding:14px 40px;background:var(--accent);border-radius:var(--radius-sm);font-size:16px;font-weight:800;color:#000;cursor:pointer;display:inline-block}

/* CONFIRM */
.confirm-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
.confirm-overlay.visible{display:flex}
.confirm-card{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);padding:24px;max-width:300px;width:calc(100% - 48px);text-align:center}
.confirm-title{font-size:17px;font-weight:700;margin-bottom:8px}
.confirm-msg{font-size:14px;color:var(--text2);margin-bottom:20px;line-height:1.5}
.confirm-btns{display:flex;gap:10px}
.confirm-btn{flex:1;padding:12px;border-radius:var(--radius-xs);font-size:15px;font-weight:700;cursor:pointer}
.confirm-btn.cancel{background:var(--bg3);color:var(--text2)}
.confirm-btn.confirm-yes-style{background:var(--red);color:#fff}
.empty-state{text-align:center;padding:60px 24px;color:var(--text3)}
.empty-state h3{font-size:18px;color:var(--text2);margin-bottom:8px}
.empty-state p{font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div id="app">
<div id="view"></div>
<div id="tabbar">
  <div class="tab active" onclick="nav('home')" id="tab-home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>Home</span>
  </div>
  <div class="tab" onclick="nav('library')" id="tab-library">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <span>Library</span>
  </div>
  <div class="tab" onclick="nav('history')" id="tab-history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>

function loadState(){
  try {
    const raw = localStorage.getItem('lift_v3');
    if (raw) {
      const p = JSON.parse(raw);
      S.exerciseHistory = mergeHistory(HEVY_HISTORY, p.exerciseHistory||{});
      S.loggedSessions = p.loggedSessions || [];
      S.runHistory = p.runHistory || [];
      S.programme = p.programme || JSON.parse(JSON.stringify(DEFAULT_PROGRAMME));
      S.savedRoutines = p.savedRoutines || [];
      S.settings = {...S.settings, ...(p.settings||{})};
    } else {
      S.exerciseHistory = JSON.parse(JSON.stringify(HEVY_HISTORY));
      S.loggedSessions = HEVY_SESSIONS.map(s => ({...s, fromHevy:true}));
      S.runHistory = [];
      S.programme = JSON.parse(JSON.stringify(DEFAULT_PROGRAMME));
      S.savedRoutines = [];
    }
  } catch(e) {
    S.exerciseHistory = JSON.parse(JSON.stringify(HEVY_HISTORY));
    S.loggedSessions = HEVY_SESSIONS.map(s => ({...s, fromHevy:true}));
    S.runHistory = []; S.programme = JSON.parse(JSON.stringify(DEFAULT_PROGRAMME)); S.savedRoutines = [];
  }
  applyTheme(S.settings.theme);
}

function mergeHistory(base, saved){
  const merged = JSON.parse(JSON.stringify(base));
  for (const [k,v] of Object.entries(saved)) {
    if (!merged[k]) merged[k] = v;
    else {
      const baseDates = new Set(merged[k].map(s=>s.date));
      for (const s of v) if (!baseDates.has(s.date)) merged[k].push(s);
      merged[k].sort((a,b)=>new Date(b.date)-new Date(a.date));
    }
  }
  return merged;
}

function save(){
  try { localStorage.setItem('lift_v3', JSON.stringify({
    exerciseHistory:S.exerciseHistory, loggedSessions:S.loggedSessions,
    runHistory:S.runHistory, programme:S.programme,
    savedRoutines:S.savedRoutines, settings:S.settings
  })); } catch(e) {}
}

// ── THEME ──
function applyTheme(t){
  S.settings.theme = t;
  if (t==='dark') document.documentElement.setAttribute('data-theme','dark');
  else if (t==='light') document.documentElement.setAttribute('data-theme','light');
  else {
    const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
  }
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
  if (S.settings.theme==='auto') applyTheme('auto');
});

// ── REST TIMER ──
let restTimer=null, restRem=0, restTotal=0;
function startRest(secs, label){
  if (restTimer) clearInterval(restTimer);
  restTotal = secs; restRem = secs;
  document.getElementById('rb-label').textContent = label||'Rest';
  document.getElementById('rest-banner').classList.add('visible');
  updateRestBanner();
  restTimer = setInterval(()=>{
    restRem--;
    if (restRem <= 0){ clearInterval(restTimer); restTimer=null; skipRest(); beep(); return; }
    updateRestBanner();
  }, 1000);
}
function updateRestBanner(){
  const m=Math.floor(restRem/60), s=restRem%60;
  document.getElementById('rb-time').textContent = `${m}:${p2(s)}`;
  document.getElementById('rb-bar').style.width = `${(restRem/restTotal)*100}%`;
}
function skipRest(){ if(restTimer){clearInterval(restTimer);restTimer=null;} document.getElementById('rest-banner').classList.remove('visible'); }
function addRestTime(s){ restRem+=s; restTotal+=s; updateRestBanner(); }
function beep(){ try{ const a=new AudioContext(),o=a.createOscillator(),g=a.createGain(); o.connect(g);g.connect(a.destination); o.frequency.value=880; g.gain.setValueAtTime(0.3,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.4); o.start();o.stop(a.currentTime+0.4); }catch(e){} }

// ── WORKOUT TIMER ──
let wkTimer=null;
function startWkTimer(){ if(wkTimer) clearInterval(wkTimer); wkTimer=setInterval(()=>{ const el=document.getElementById('wk-elapsed'); if(el&&S.activeWorkout) el.textContent=fmtDur(Math.floor((Date.now()-S.activeWorkout.startTime)/1000)); },1000); }
function stopWkTimer(){ if(wkTimer){clearInterval(wkTimer);wkTimer=null;} }
function fmtDur(s){ const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60; return h>0?`${h}:${p2(m)}:${p2(sec)}`:`${m}:${p2(sec)}`; }
function p2(n){ return n.toString().padStart(2,'0'); }

// ── NAV ──
function nav(tab){ S.screen=null; showTab(tab); }
function showTab(tab){
  S.tab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const el=document.getElementById('tab-'+tab); if(el) el.classList.add('active');
  render();
}
function render(){
  const v=document.getElementById('view'); v.scrollTop=0;
  if (S.activeWorkout && S.screen==='workout'){ renderWorkout(v); return; }
  if (S.screen==='run'){ renderRunLogger(v); return; }
  if (S.screen==='editDay'){ renderEditDay(v); return; }
  switch(S.tab){
    case 'home': renderHome(v); break;
    case 'library': renderLibrary(v); break;
    case 'history': renderHistory(v); break;
    case 'settings': renderSettings(v); break;
  }
}

// ── HOME ──
function renderHome(v){
  const today=new Date(), dow=today.getDay(), progDay=dow===0?6:dow-1;
  const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const thisWeek=S.loggedSessions.filter(s=>{ try{return (Date.now()-new Date(s.date))<7*864e5;}catch(e){return false;} }).length;
  let h=`<div class="page-header"><div class="page-title">Lift 🏋️</div><div class="page-subtitle">${today.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'})}</div></div>
  <div class="stat-row">
    <div class="stat-pill"><div class="sv">${thisWeek}</div><div class="sl">This week</div></div>
    <div class="stat-pill"><div class="sv">${S.loggedSessions.length}</div><div class="sl">Workouts</div></div>
    <div class="stat-pill"><div class="sv">${S.runHistory.length}</div><div class="sl">Runs</div></div>
  </div><div class="section-label">Your Week</div>`;
  for(let i=0;i<7;i++){
    const prog=S.programme[i], isToday=i===progDay, isRun=prog.type==='run';
    const exText=isRun?prog.label:prog.exercises.map(e=>e.name.split('(')[0].trim()).join(' · ');
    h+=`<div class="day-card ${isToday?'today':''}" onclick="startDay(${i})">
      <div class="day-card-top"><div class="day-label ${isToday?'today-lbl':''}">${isToday?'▶ TODAY — ':''}${DAYS[i]}</div><div class="day-badge ${isRun?'run':'lift'}">${isRun?'🏃 Run':'💪 Lift'}</div></div>
      <div class="day-name">${prog.name}</div><div class="day-ex">${exText}</div>
    </div>`;
  }
  v.innerHTML=h;
}

// ── LIBRARY ──
function renderLibrary(v){
  const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let h=`<div class="page-header"><div class="page-title">Library</div><div class="page-subtitle">Routines & programme</div></div><div class="section-label">Weekly Programme</div>`;
  for(let i=0;i<7;i++){
    const prog=S.programme[i], isRun=prog.type==='run';
    h+=`<div class="routine-card">
      <div class="routine-card-top">
        <div><div class="routine-name">${prog.name}</div><div class="routine-meta">${DAYS[i]} · ${isRun?'🏃 Run':'💪 Lift'} · ${isRun?prog.label:prog.exercises.length+' exercises'}</div></div>
        <div class="routine-actions">
          ${!isRun?`<div class="icon-btn" onclick="editDayScreen(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div>`:''}
          <div class="icon-btn" onclick="startDay(${i})" style="background:var(--accent-dim);border-color:var(--accent)"><svg viewBox="0 0 24 24" fill="currentColor" style="color:var(--accent)"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
        </div>
      </div>
    </div>`;
  }
  h+=`<div class="section-label" style="margin-top:8px">Saved Routines</div>`;
  if(S.savedRoutines.length===0){
    h+=`<div class="empty-state"><h3>No saved routines yet</h3><p>Build a custom routine below — name it, add exercises, save it. Start it any time.</p></div>`;
  } else {
    S.savedRoutines.forEach((r,i)=>{
      h+=`<div class="routine-card">
        <div class="routine-card-top">
          <div><div class="routine-name">${r.name}</div><div class="routine-meta">💪 Lift · ${r.exercises.length} exercises</div></div>
          <div class="routine-actions">
            <div class="icon-btn" onclick="editRoutineModal(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div>
            <div class="icon-btn danger" onclick="deleteRoutine(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></div>
            <div class="icon-btn" onclick="startSavedRoutine(${i})" style="background:var(--accent-dim);border-color:var(--accent)"><svg viewBox="0 0 24 24" fill="currentColor" style="color:var(--accent)"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
          </div>
        </div>
      </div>`;
    });
  }
  h+=`<div class="new-routine-btn" onclick="newRoutineModal()">+ New Routine</div>`;
  v.innerHTML=h;
}
function deleteRoutine(i){ showConfirm('Delete Routine','This cannot be undone.',()=>{ S.savedRoutines.splice(i,1); save(); renderLibrary(document.getElementById('view')); }); }

// ── START WORKOUT ──
function startDay(dayIdx){
  const prog=S.programme[dayIdx];
  if(prog.type==='run'){ S.screen='run'; S.runDayIdx=dayIdx; S.tab='home'; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.getElementById('tab-home').classList.add('active'); render(); return; }
  launchLift(prog.name, prog.exercises, dayIdx, null);
}
function startSavedRoutine(i){ const r=S.savedRoutines[i]; launchLift(r.name, r.exercises, null, i); }
function launchLift(name, templates, dayIdx, routineIdx){
  const exercises = templates.map(ex=>{
    const hist=S.exerciseHistory[ex.name];
    let sets=[];
    if(hist&&hist.length>0){
      const last=[...hist].sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
      sets=last.sets.map(s=>({weight:s.weight??null,reps:s.reps??null,duration:s.duration??null,completed:false}));
    } else {
      sets=[{weight:null,reps:null,completed:false},{weight:null,reps:null,completed:false},{weight:null,reps:null,completed:false}];
    }
    return {...ex, sets};
  });
  S.activeWorkout={name,dayIdx,routineIdx,startTime:Date.now(),exercises};
  S.screen='workout'; S.tab='home';
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-home').classList.add('active');
  startWkTimer(); render();
}

// ── ACTIVE WORKOUT ──
function renderWorkout(v){
  const {name,startTime,exercises}=S.activeWorkout;
  let h=`<div class="wk-header">
    <div class="back-btn" onclick="cancelWorkout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></div>
    <div class="wk-title-wrap"><div class="wk-main-title">${name}</div><div class="wk-day-label">In progress</div></div>
    <div class="wk-timer" id="wk-elapsed">${fmtDur(Math.floor((Date.now()-startTime)/1000))}</div>
  </div>`;
  exercises.forEach((ex,ei)=>{
    const hist=S.exerciseHistory[ex.name];
    const sorted=hist?[...hist].sort((a,b)=>new Date(b.date)-new Date(a.date)):[];
    const prev=sorted.length>1?sorted[1]:(sorted.length===1?sorted[0]:null);
    const isDur=ex.sets[0]&&ex.sets[0].duration!==undefined&&ex.sets[0].weight===null&&ex.sets[0].reps===null;
    if(prev&&prev.sets.length>0){
      h+=`<div class="prev-banner"><div class="prev-lbl">Previous · ${prev.date}</div><div class="prev-chips">${prev.sets.map(s=>{
        const t=s.duration?`${s.duration}s`:s.weight?`${s.weight}kg×${s.reps}`:`${s.reps} reps`;
        return `<div class="prev-chip">${t}</div>`;
      }).join('')}</div></div>`;
    }
    h+=`<div class="ex-block" id="ex-${ei}">
      <div class="ex-header">
        <div class="ex-header-info"><div class="ex-name">${ex.name}</div><div class="ex-meta">${ex.isMain?'Main · ':''}Rest ${ex.restSeconds||90}s</div></div>
        <div class="ex-actions"><div class="icon-btn" onclick="swapEx(${ei})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></div></div>
      </div>
      <div class="sets-head"><span>#</span>${isDur?'<span>Secs</span><span></span>':'<span>kg</span><span>Reps</span>'}<span></span><span></span></div>`;
    ex.sets.forEach((set,si)=>{
      const done=set.completed;
      h+=`<div class="set-row ${done?'done-row':''}" id="sr-${ei}-${si}"><div class="set-num">${si+1}</div>`;
      if(isDur){
        h+=`<input class="set-inp" id="inp-d-${ei}-${si}" type="number" inputmode="numeric" value="${set.duration??''}" placeholder="0" ${done?'readonly':''} onfocus="this.select()" oninput="updDur(${ei},${si},this.value)"><div></div>`;
      } else {
        h+=`<input class="set-inp" id="inp-w-${ei}-${si}" type="number" inputmode="decimal" step="0.5" value="${set.weight??''}" placeholder="—" ${done?'readonly':''} onfocus="this.select()" oninput="updW(${ei},${si},this.value)">
        <input class="set-inp" id="inp-r-${ei}-${si}" type="number" inputmode="numeric" value="${set.reps??''}" placeholder="—" ${done?'readonly':''} onfocus="this.select()" oninput="updR(${ei},${si},this.value)">`;
      }
      h+=`<div class="tick-btn ${done?'done':''}" id="tick-${ei}-${si}" onclick="tickSet(${ei},${si})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="del-set-btn" onclick="delSet(${ei},${si})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div></div>`;
    });
    h+=`<div class="add-set-row" onclick="addSet(${ei})">+ Add Set</div></div>`;
  });
  h+=`<div class="finish-btn" onclick="finishWorkout()">Finish Workout ✓</div><div style="height:8px"></div>`;
  v.innerHTML=h; startWkTimer();
}

function updW(ei,si,val){ S.activeWorkout.exercises[ei].sets[si].weight=val===''?null:parseFloat(val); }
function updR(ei,si,val){ S.activeWorkout.exercises[ei].sets[si].reps=val===''?null:parseInt(val); }
function updDur(ei,si,val){ S.activeWorkout.exercises[ei].sets[si].duration=val===''?null:parseFloat(val); }

function tickSet(ei,si){
  const set=S.activeWorkout.exercises[ei].sets[si];
  set.completed=!set.completed;
  const row=document.getElementById(`sr-${ei}-${si}`), tick=document.getElementById(`tick-${ei}-${si}`);
  if(set.completed){
    row.classList.add('done-row'); tick.classList.add('done');
    ['inp-w-','inp-r-','inp-d-'].forEach(p=>{const el=document.getElementById(p+`${ei}-${si}`);if(el)el.setAttribute('readonly',true);});
    const ex=S.activeWorkout.exercises[ei];
    startRest(ex.restSeconds||(ex.isMain?S.settings.mainRestSeconds:S.settings.accessoryRestSeconds), `Rest — ${ex.name}`);
  } else {
    row.classList.remove('done-row'); tick.classList.remove('done');
    ['inp-w-','inp-r-','inp-d-'].forEach(p=>{const el=document.getElementById(p+`${ei}-${si}`);if(el)el.removeAttribute('readonly');});
  }
}
function addSet(ei){
  const ex=S.activeWorkout.exercises[ei], last=ex.sets[ex.sets.length-1];
  ex.sets.push({weight:last?.weight??null,reps:last?.reps??null,duration:last?.duration??null,completed:false});
  renderWorkout(document.getElementById('view'));
  setTimeout(()=>{ const el=document.getElementById(`ex-${ei}`); if(el) el.scrollIntoView({behavior:'smooth',block:'end'}); },80);
}
function delSet(ei,si){
  if(S.activeWorkout.exercises[ei].sets.length<=1) return;
  S.activeWorkout.exercises[ei].sets.splice(si,1);
  renderWorkout(document.getElementById('view'));
}
function swapEx(ei){
  openExModal('Swap Exercise',(name)=>{
    const ex=S.activeWorkout.exercises[ei]; ex.name=name;
    const hist=S.exerciseHistory[name];
    if(hist&&hist.length>0){ const last=[...hist].sort((a,b)=>new Date(b.date)-new Date(a.date))[0]; ex.sets=last.sets.map(s=>({weight:s.weight??null,reps:s.reps??null,duration:s.duration??null,completed:false})); }
    renderWorkout(document.getElementById('view'));
  });
}
function cancelWorkout(){ showConfirm('Cancel Workout','Progress will be lost.',()=>{ S.activeWorkout=null;S.screen=null;stopWkTimer();skipRest();render(); }); }
function finishWorkout(){
  const {name,startTime,exercises}=S.activeWorkout;
  const durMins=Math.round((Date.now()-startTime)/60000);
  const dateStr=new Date().toLocaleString('en-AU',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  exercises.forEach(ex=>{
    const completed=ex.sets.filter(s=>s.completed);
    if(completed.length>0){
      if(!S.exerciseHistory[ex.name]) S.exerciseHistory[ex.name]=[];
      S.exerciseHistory[ex.name].unshift({date:dateStr,workoutName:name,sets:completed.map((s,i)=>({setIndex:i,type:'normal',weight:s.weight,reps:s.reps,duration:s.duration}))});
    }
  });
  const totalSets=exercises.reduce((a,ex)=>a+ex.sets.filter(s=>s.completed).length,0);
  S.loggedSessions.unshift({date:dateStr,workoutName:name,durationMins:durMins,exercises:exercises.map(ex=>({name:ex.name,sets:ex.sets.filter(s=>s.completed).map(s=>({weight:s.weight,reps:s.reps,duration:s.duration}))}))});
  save();
  S.activeWorkout=null; S.screen=null; stopWkTimer(); skipRest();
  document.getElementById('done-title').textContent=`${name} Done! 🔥`;
  document.getElementById('done-stats').innerHTML=`${totalSets} sets · ${durMins} min`;
  document.getElementById('done-modal').classList.add('visible');
}
function closeDoneModal(){ document.getElementById('done-modal').classList.remove('visible'); nav('home'); }

// ── RUN LOGGER ──
function renderRunLogger(v){
  const prog=S.programme[S.runDayIdx], recent=S.runHistory.slice(0,3);
  let h=`<div class="wk-header">
    <div class="back-btn" onclick="S.screen=null;render()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></div>
    <div class="wk-title-wrap"><div class="wk-main-title">${prog.name}</div><div class="wk-day-label">${prog.label}</div></div>
  </div><div style="height:14px"></div>
  <div class="run-block">
    <div class="ex-name" style="margin-bottom:4px">Log Today's Run</div>
    <div style="font-size:13px;color:var(--text3);margin-bottom:2px">Time</div>
    <div class="run-time-row">
      <div class="run-field"><label>Hours</label><input class="run-inp" id="r-h" type="number" inputmode="numeric" min="0" max="23" placeholder="0"></div>
      <div class="run-field"><label>Minutes</label><input class="run-inp" id="r-m" type="number" inputmode="numeric" min="0" max="59" placeholder="00"></div>
      <div class="run-field"><label>Seconds</label><input class="run-inp" id="r-s" type="number" inputmode="numeric" min="0" max="59" placeholder="00"></div>
    </div>
    <div class="run-dist-row"><div class="run-field"><label>Distance (km)</label><input class="run-inp dist" id="r-d" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></div></div>
    <div class="log-run-btn" onclick="logRun()">Save Run ✓</div>
  </div>`;
  if(recent.length>0){
    h+=`<div class="section-label">Recent Runs</div>`;
    recent.forEach(r=>{
      h+=`<div class="run-hist-item">
        <div class="rhi-left"><div class="rhi-date">${r.date}</div><div class="rhi-name">${r.name}</div></div>
        <div class="rhi-right"><div class="rhi-dist">${r.distKm} km</div><div class="rhi-time">${r.timeStr}${r.pace?` · ${r.pace}/km`:''}</div></div>
      </div>`;
    });
  }
  v.innerHTML=h;
}
function logRun(){
  const h=parseInt(document.getElementById('r-h').value)||0;
  const m=parseInt(document.getElementById('r-m').value)||0;
  const s=parseInt(document.getElementById('r-s').value)||0;
  const dist=parseFloat(document.getElementById('r-d').value);
  if(!dist||(h===0&&m===0&&s===0)){ alert('Please enter distance and time.'); return; }
  const totalSecs=h*3600+m*60+s;
  const timeStr=h>0?`${h}:${p2(m)}:${p2(s)}`:`${m}:${p2(s)}`;
  let pace='';
  if(dist>0){ const ps=totalSecs/dist; pace=`${Math.floor(ps/60)}:${p2(Math.round(ps%60))}`; }
  const dateStr=new Date().toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
  S.runHistory.unshift({date:dateStr,name:S.programme[S.runDayIdx].name,distKm:dist.toFixed(2),timeStr,pace,totalSecs});
  save();
  document.getElementById('done-title').textContent='Run Logged! 🏃';
  document.getElementById('done-stats').innerHTML=`${dist.toFixed(2)} km in ${timeStr}${pace?`<br>Pace: ${pace}/km`:''}`;
  document.getElementById('done-modal').classList.add('visible');
  S.screen=null;
}

// ── HISTORY ──
function renderHistory(v){
  let h=`<div class="page-header"><div class="page-title">History</div></div>
  <div class="filter-tabs">
    <div class="ftab ${S.historyFilter==='all'?'active':''}" onclick="setHistFilter('all')">All</div>
    <div class="ftab ${S.historyFilter==='lifts'?'active':''}" onclick="setHistFilter('lifts')">Lifts</div>
    <div class="ftab ${S.historyFilter==='runs'?'active':''}" onclick="setHistFilter('runs')">Runs</div>
    <div class="ftab ${S.historyView==='calendar'?'active':''}" onclick="toggleCalView()">📅 Calendar</div>
  </div>`;
  if(S.historyView==='calendar'){ h+=renderCalendar(); v.innerHTML=h; return; }
  let items=[];
  if(S.historyFilter!=='runs') S.loggedSessions.forEach((s,i)=>items.push({type:'lift',i,data:s}));
  if(S.historyFilter!=='lifts') S.runHistory.forEach((r,i)=>items.push({type:'run',i,data:r}));
  items.sort((a,b)=>{ try{return new Date(b.data.date)-new Date(a.data.date);}catch(e){return 0;} });
  if(items.length===0){
    h+=`<div class="empty-state"><h3>Nothing yet</h3><p>Complete a workout or log a run and it'll appear here.</p></div>`;
  } else {
    items.forEach((item,idx)=>{
      if(item.type==='run'){
        const r=item.data;
        h+=`<div class="run-hist-item"><div class="rhi-left"><div class="rhi-date">${r.date}</div><div class="rhi-name">${r.name}</div></div><div class="rhi-right"><div class="rhi-dist">${r.distKm} km</div><div class="rhi-time">${r.timeStr}${r.pace?` · ${r.pace}/km`:''}</div></div></div>`;
      } else {
        const s=item.data;
        const totalSets=s.exercises?s.exercises.reduce((a,e)=>a+(e.sets?e.sets.length:0),0):0;
        h+=`<div class="hist-session">
          <div class="hist-sess-hdr" onclick="toggleHist('hb${idx}','chv${idx}')">
            <div><div class="hist-sess-title">${s.workoutName}</div><div class="hist-sess-date">${s.date} · ${s.durationMins||'?'} min · ${totalSets} sets</div></div>
            <svg class="chevron" id="chv${idx}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="hist-sess-body" id="hb${idx}">
            ${(s.exercises||[]).map(ex=>{
              if(!ex.sets||ex.sets.length===0) return '';
              return `<div class="hist-ex-name">${ex.name}</div>${ex.sets.map((set,si)=>{
                let t=`Set ${si+1}: `;
                if(set.duration) t+=`${set.duration}s`;
                else if(set.weight) t+=`${set.weight}kg × ${set.reps} reps`;
                else if(set.reps) t+=`${set.reps} reps`;
                return `<div class="hist-set-line">${t}</div>`;
              }).join('')}`;
            }).join('')}
          </div>
        </div>`;
      }
    });
  }
  v.innerHTML=h;
}
function setHistFilter(f){ S.historyFilter=f; S.historyView='list'; renderHistory(document.getElementById('view')); }
function toggleCalView(){ S.historyView=S.historyView==='calendar'?'list':'calendar'; renderHistory(document.getElementById('view')); }
function toggleHist(bodyId,chevId){ const b=document.getElementById(bodyId),c=document.getElementById(chevId); if(b)b.classList.toggle('open'); if(c)c.classList.toggle('open'); }

function renderCalendar(){
  const y=S.calYear, mo=S.calMonth;
  const monthName=new Date(y,mo,1).toLocaleString('en-AU',{month:'long',year:'numeric'});
  const firstDay=new Date(y,mo,1).getDay(), daysInMonth=new Date(y,mo+1,0).getDate();
  const startOffset=(firstDay+6)%7, today=new Date();
  const actMap={};
  S.loggedSessions.forEach(s=>{ try{const d=new Date(s.date),k=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;if(!actMap[k])actMap[k]=[];actMap[k].push('lift');}catch(e){} });
  S.runHistory.forEach(r=>{ try{const d=new Date(r.date),k=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;if(!actMap[k])actMap[k]=[];actMap[k].push('run');}catch(e){} });
  let h=`<div class="cal-nav">
    <div class="cal-nav-btn" onclick="calPrev()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></div>
    <div class="cal-month">${monthName}</div>
    <div class="cal-nav-btn" onclick="calNext()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div>
  </div><div class="cal-grid">${['M','T','W','T','F','S','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}`;
  for(let i=0;i<startOffset;i++) h+=`<div class="cal-day other-month"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const k=`${y}-${mo}-${d}`, acts=actMap[k]||[];
    const isToday=d===today.getDate()&&mo===today.getMonth()&&y===today.getFullYear();
    const hl=acts.includes('lift'), hr=acts.includes('run');
    h+=`<div class="cal-day ${isToday?'today-cal':''}">${d}<div style="display:flex;gap:2px">${hl?'<div class="cal-dot lift-dot"></div>':''}${hr?'<div class="cal-dot run-dot"></div>':''}</div></div>`;
  }
  return h+'</div>';
}
function calPrev(){ S.calMonth--; if(S.calMonth<0){S.calMonth=11;S.calYear--;} renderHistory(document.getElementById('view')); }
function calNext(){ S.calMonth++; if(S.calMonth>11){S.calMonth=0;S.calYear++;} renderHistory(document.getElementById('view')); }

// ── EDIT DAY ──
let editDayIdx=null;
function editDayScreen(i){ editDayIdx=i; S.screen='editDay'; render(); }
function renderEditDay(v){
  const prog=S.programme[editDayIdx];
  const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  let h=`<div class="wk-header">
    <div class="back-btn" onclick="S.screen=null;S.tab='library';render()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></div>
    <div class="wk-title-wrap"><div class="wk-main-title">Edit ${DAYS[editDayIdx]}</div><div class="wk-day-label">Reorder · swap · remove</div></div>
  </div><div style="height:12px"></div>`;
  prog.exercises.forEach((ex,i)=>{
    h+=`<div class="edit-ex-row" id="eer-${i}">
      <div class="drag-handle" data-idx="${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></div>
      <div class="edit-ex-info">
        <div class="edit-ex-name">${ex.name}</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:5px">
          <span class="main-toggle ${ex.isMain?'is-main':'not-main'}" onclick="toggleMain(${i})">${ex.isMain?'★ Main':'☆ Acc'}</span>
          <span style="font-size:12px;color:var(--text3)">Rest:</span>
          <input class="rest-inline" type="number" value="${ex.restSeconds}" onchange="updateRest(${i},this.value)">s
        </div>
      </div>
      <div style="display:flex;gap:6px">
        <div class="icon-btn" onclick="swapDayEx(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></div>
        <div class="icon-btn danger" onclick="removeDayEx(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
      </div>
    </div>`;
  });
  h+=`<div onclick="addDayEx()" style="margin:8px 16px;padding:12px;border:1.5px dashed var(--border2);border-radius:var(--radius-xs);text-align:center;font-size:14px;font-weight:700;color:var(--text3);cursor:pointer">+ Add Exercise</div>`;
  v.innerHTML=h;
  // drag-to-reorder
  let drag=null,dragFrom=null;
  document.querySelectorAll('.drag-handle').forEach(handle=>{
    handle.addEventListener('touchstart',e=>{ dragFrom=parseInt(handle.dataset.idx); drag=document.getElementById('eer-'+dragFrom); drag.style.opacity='0.5'; e.preventDefault(); },{passive:false});
  });
  document.addEventListener('touchend',()=>{ if(drag){drag.style.opacity='';drag=null;dragFrom=null;} });
  document.addEventListener('touchmove',e=>{
    if(!drag) return;
    const t=e.touches[0];
    document.querySelectorAll('[id^="eer-"]').forEach((el,i)=>{
      const r=el.getBoundingClientRect();
      if(t.clientY>r.top&&t.clientY<r.bottom&&i!==dragFrom){
        const exs=S.programme[editDayIdx].exercises, [item]=exs.splice(dragFrom,1); exs.splice(i,0,item); save();
        dragFrom=i; renderEditDay(document.getElementById('view'));
      }
    });
  });
}
function toggleMain(i){ S.programme[editDayIdx].exercises[i].isMain=!S.programme[editDayIdx].exercises[i].isMain; save(); renderEditDay(document.getElementById('view')); }
function updateRest(i,v){ S.programme[editDayIdx].exercises[i].restSeconds=parseInt(v)||90; save(); }
function swapDayEx(i){ openExModal('Swap Exercise',name=>{ S.programme[editDayIdx].exercises[i].name=name; save(); renderEditDay(document.getElementById('view')); }); }
function removeDayEx(i){ S.programme[editDayIdx].exercises.splice(i,1); save(); renderEditDay(document.getElementById('view')); }
function addDayEx(){ openExModal('Add Exercise',name=>{ S.programme[editDayIdx].exercises.push({name,isMain:false,restSeconds:S.settings.accessoryRestSeconds}); save(); renderEditDay(document.getElementById('view')); }); }

// ── ROUTINE BUILDER ──
function newRoutineModal(){ S.rbModalExercises=[]; S.rbModalEditIdx=null; document.getElementById('rb-modal-title').textContent='New Routine'; document.getElementById('rb-name-inp').value=''; renderRbList(); document.getElementById('rb-modal').classList.add('visible'); }
function editRoutineModal(i){ S.rbModalEditIdx=i; const r=S.savedRoutines[i]; S.rbModalExercises=r.exercises.map(e=>({...e})); document.getElementById('rb-modal-title').textContent='Edit Routine'; document.getElementById('rb-name-inp').value=r.name; renderRbList(); document.getElementById('rb-modal').classList.add('visible'); }
function renderRbList(){
  const list=document.getElementById('rb-ex-list');
  if(!S.rbModalExercises.length){ list.innerHTML=`<div style="padding:24px;text-align:center;color:var(--text3);font-size:14px">No exercises yet</div>`; return; }
  list.innerHTML=S.rbModalExercises.map((ex,i)=>`<div class="rb-ex-item"><div class="rb-ex-name">${ex.name}</div><div class="rb-rm-btn" onclick="rbRm(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div></div>`).join('');
}
function rbRm(i){ S.rbModalExercises.splice(i,1); renderRbList(); }
function openExModalForBuilder(){ openExModal('Add Exercise',name=>{ S.rbModalExercises.push({name,isMain:false,restSeconds:S.settings.accessoryRestSeconds}); renderRbList(); }); }
function saveRoutine(){
  const name=document.getElementById('rb-name-inp').value.trim();
  if(!name){ alert('Enter a routine name.'); return; }
  if(!S.rbModalExercises.length){ alert('Add at least one exercise.'); return; }
  const routine={name,exercises:S.rbModalExercises.map(e=>({...e}))};
  if(S.rbModalEditIdx!==null) S.savedRoutines[S.rbModalEditIdx]=routine;
  else S.savedRoutines.push(routine);
  save(); closeRbModal(); renderLibrary(document.getElementById('view'));
}
function closeRbModal(){ document.getElementById('rb-modal').classList.remove('visible'); }

// ── SETTINGS ──
function renderSettings(v){
  let h=`<div class="page-header"><div class="page-title">Settings</div></div>
  <div class="settings-group">
    <div class="settings-group-lbl">Appearance</div>
    <div class="settings-row"><div class="settings-lbl">Theme</div>
      <div class="theme-picker">
        <div class="theme-opt ${S.settings.theme==='auto'?'active':''}" onclick="setTheme('auto')">Auto</div>
        <div class="theme-opt ${S.settings.theme==='dark'?'active':''}" onclick="setTheme('dark')">Dark</div>
        <div class="theme-opt ${S.settings.theme==='light'?'active':''}" onclick="setTheme('light')">Light</div>
      </div>
    </div>
  </div>
  <div class="settings-group">
    <div class="settings-group-lbl">Rest Timers</div>
    <div class="settings-row"><div class="settings-lbl">Main lifts (sec)</div><input class="s-inp" type="number" value="${S.settings.mainRestSeconds}" inputmode="numeric" onchange="S.settings.mainRestSeconds=parseInt(this.value);save()"></div>
    <div class="settings-row"><div class="settings-lbl">Accessories (sec)</div><input class="s-inp" type="number" value="${S.settings.accessoryRestSeconds}" inputmode="numeric" onchange="S.settings.accessoryRestSeconds=parseInt(this.value);save()"></div>
  </div>
  <div class="settings-group">
    <div class="settings-group-lbl">Data</div>
    <div class="settings-row" onclick="exportData()" style="cursor:pointer"><div class="settings-lbl">Export history (JSON)</div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></div>
    <div class="settings-row" onclick="clearData()" style="cursor:pointer"><div class="settings-lbl danger-lbl">Clear all data</div></div>
  </div>
  <div style="padding:16px 20px;font-size:12px;color:var(--text3);text-align:center">Lift v2.0 · HEVY history imported · Add to Home Screen for best experience</div>`;
  v.innerHTML=h;
}
function setTheme(t){ applyTheme(t); save(); renderSettings(document.getElementById('view')); }
function exportData(){
  const blob=new Blob([JSON.stringify({loggedSessions:S.loggedSessions,runHistory:S.runHistory,exerciseHistory:S.exerciseHistory},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=`lift-export-${new Date().toISOString().slice(0,10)}.json`; a.click();
}
function clearData(){ showConfirm('Clear All Data','Deletes all workout and run history. Cannot be undone.',()=>{ localStorage.removeItem('lift_v3'); loadState(); render(); }); }

// ── EXERCISE MODAL ──
function openExModal(title,cb){
  S.exModalCallback=cb;
  document.getElementById('ex-modal-title').textContent=title;
  document.getElementById('ex-search').value='';
  document.getElementById('ex-modal').classList.add('visible');
  populateExList('');
  setTimeout(()=>document.getElementById('ex-search').focus(),100);
}
function closeExModal(){ document.getElementById('ex-modal').classList.remove('visible'); S.exModalCallback=null; }
function filterEx(){ populateExList(document.getElementById('ex-search').value); }
function populateExList(q){
  const all=Object.keys(S.exerciseHistory).sort();
  const filtered=q?all.filter(n=>n.toLowerCase().includes(q.toLowerCase())):all;
  document.getElementById('ex-list').innerHTML=filtered.map(n=>`<div class="modal-item" onclick="selectEx('${n.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')"><span>${n}</span><span class="modal-item-meta">${(S.exerciseHistory[n]||[]).length} sessions</span></div>`).join('');
}
function selectEx(name){ if(S.exModalCallback) S.exModalCallback(name); closeExModal(); }
function addCustomEx(){
  const name=document.getElementById('new-ex-inp').value.trim();
  if(!name) return;
  if(!S.exerciseHistory[name]) S.exerciseHistory[name]=[];
  selectEx(name);
  document.getElementById('new-ex-inp').value='';
}
document.getElementById('ex-modal').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeExModal(); });
document.getElementById('rb-modal').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeRbModal(); });

// ── CONFIRM ──
let confirmCb=null;
function showConfirm(title,msg,cb){ confirmCb=cb; document.getElementById('confirm-title').textContent=title; document.getElementById('confirm-msg').textContent=msg; document.getElementById('confirm-overlay').classList.add('visible'); }
function closeConfirm(){ document.getElementById('confirm-overlay').classList.remove('visible'); confirmCb=null; }
document.getElementById('confirm-yes').addEventListener('click',()=>{ if(confirmCb) confirmCb(); closeConfirm(); });

// ── INIT ──
loadState();
render();
</script>
