<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift">
<title>Lift</title>
<style>
:root {
  --bg:#0d0d0f;--bg2:#16161a;--bg3:#1e1e24;--bg4:#26262e;--bg5:#2e2e38;
  --border:#2e2e38;--border2:#3a3a48;
  --text:#f0f0f4;--text2:#a0a0b0;--text3:#606078;
  --accent:#e0ff4f;--accent-dim:rgba(224,255,79,0.12);--accent-dim2:rgba(224,255,79,0.05);
  --red:#ff5c5c;--red-dim:rgba(255,92,92,0.12);
  --blue:#4fa8ff;--blue-dim:rgba(79,168,255,0.14);
  --green:#4fff9a;
  --radius:14px;--radius-sm:9px;--radius-xs:6px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="light"]{
  --bg:#f2f2f7;--bg2:#fff;--bg3:#f5f5fa;--bg4:#eaeaf0;--bg5:#e0e0ea;
  --border:#d8d8e8;--border2:#c8c8d8;
  --text:#0d0d14;--text2:#5a5a70;--text3:#9090a8;
  --accent:#5a9400;--accent-dim:rgba(90,148,0,0.1);--accent-dim2:rgba(90,148,0,0.05);
  --red:#cc2020;--red-dim:rgba(204,32,32,0.1);
  --blue:#0060cc;--blue-dim:rgba(0,96,204,0.1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg);color:var(--text)}
#app{display:flex;flex-direction:column;height:100%}
#view{flex:1;overflow-y:auto;padding-bottom:calc(64px + var(--safe-b));padding-top:var(--safe-t)}
#view::-webkit-scrollbar{display:none}

/* TAB BAR */
#tabbar{position:fixed;bottom:0;left:0;right:0;height:calc(64px + var(--safe-b));background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:8px;padding-bottom:var(--safe-b);z-index:100}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;color:var(--text3);transition:color .15s}
.tab.active{color:var(--accent)}
.tab svg{width:22px;height:22px}
.tab span{font-size:10px;font-weight:600;letter-spacing:.02em}

/* REST BANNER - fixed at top of screen */
#rest-banner{position:fixed;top:0;left:0;right:0;z-index:200;background:var(--bg2);border-bottom:2px solid var(--accent);display:none;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + var(--safe-t));box-shadow:0 2px 16px rgba(0,0,0,0.35)}
#rest-banner.visible{display:flex}
#view.rest-active{padding-top:calc(var(--safe-t) + 70px)}
.rb-info{flex-shrink:0}
.rb-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em}
.rb-time{font-size:28px;font-weight:700;color:var(--accent);letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.rb-bar-wrap{flex:1;height:4px;background:var(--bg4);border-radius:2px;overflow:hidden}
.rb-bar{height:100%;background:var(--accent);border-radius:2px;transition:width 1s linear}
.rb-skip{padding:8px 16px;background:var(--accent);border-radius:20px;font-size:13px;font-weight:700;color:#000;cursor:pointer;white-space:nowrap}
.rb-add{padding:8px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer}

/* PAGE */
.page-header{padding:20px 20px 12px}
.page-title{font-size:28px;font-weight:700;letter-spacing:-.5px}
.page-subtitle{font-size:14px;color:var(--text2);margin-top:2px}
.section-label{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:4px 20px 8px}
.stat-row{display:flex;gap:10px;padding:0 16px 14px}
.stat-pill{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;text-align:center}
.stat-pill .sv{font-size:22px;font-weight:700}
.stat-pill .sl{font-size:11px;color:var(--text2);margin-top:2px}

/* DAY CARDS */
.day-card{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);margin:0 16px 10px;padding:16px;cursor:pointer;transition:border-color .15s}
.day-card:active{background:var(--bg3)}
.day-card.today{border-color:var(--accent)}
.day-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.day-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.day-label.today-lbl{color:var(--accent)}
.day-name{font-size:19px;font-weight:700;letter-spacing:-.3px}
.day-ex{font-size:13px;color:var(--text2);margin-top:3px;line-height:1.45}
.day-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.day-badge.lift{background:var(--accent-dim);color:var(--accent)}
.day-badge.run{background:var(--blue-dim);color:var(--blue)}

/* WORKOUT HEADER */
.wk-header{padding:14px 16px 10px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--border)}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.back-btn svg{width:18px;height:18px}
.wk-title-wrap{flex:1;min-width:0}
.wk-main-title{font-size:20px;font-weight:700;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-day-label{font-size:13px;color:var(--text2)}
.wk-timer{font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-dim);padding:5px 11px;border-radius:20px;flex-shrink:0;font-variant-numeric:tabular-nums}

/* EXERCISE BLOCK */
.ex-block{margin:12px 16px 0;background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.ex-header{padding:14px 16px 10px;display:flex;align-items:flex-start;gap:8px}
.ex-header-info{flex:1;min-width:0}
.ex-name{font-size:16px;font-weight:700}
.ex-meta{font-size:12px;color:var(--text3);margin-top:3px}
.ex-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{width:32px;height:32px;border-radius:var(--radius-xs);background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn svg{width:15px;height:15px;color:var(--text2)}
.icon-btn.danger svg{color:var(--red)}

/* PREV BANNER */
.prev-banner{padding:9px 16px;background:var(--bg3);border-top:1px solid var(--border)}
.prev-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.prev-chips{display:flex;gap:6px;flex-wrap:wrap}
.prev-chip{font-size:12px;color:var(--text2);background:var(--bg4);padding:3px 8px;border-radius:20px}

/* SETS */
.sets-head{display:grid;grid-template-columns:28px 1fr 1fr 44px 24px;gap:6px;padding:8px 16px 5px}
.sets-head span{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;text-align:center}
.sets-head span:first-child{text-align:left}
.set-row{display:grid;grid-template-columns:28px 1fr 1fr 44px 24px;gap:6px;padding:5px 16px;align-items:center;transition:background .1s}
.set-row.done-row{background:var(--accent-dim2)}
.set-num{font-size:13px;font-weight:700;color:var(--text3)}
.set-num-tap{cursor:pointer;color:var(--blue);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
.set-inp{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-xs);padding:8px 4px;text-align:center;font-size:16px;font-weight:700;color:var(--text);width:100%;-webkit-appearance:none;font-family:inherit}
.set-inp:focus{outline:none;border-color:var(--accent);background:var(--bg2)}
.set-inp[readonly]{opacity:.45;pointer-events:none}
.tick-btn{width:44px;height:44px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0}
.tick-btn.done{background:var(--accent);border-color:var(--accent)}
.tick-btn svg{width:20px;height:20px;color:var(--text3)}
.tick-btn.done svg{color:#000}
.del-set-btn{width:24px;height:24px;border-radius:50%;background:transparent;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.35}
.del-set-btn:active{opacity:1}
.del-set-btn svg{width:13px;height:13px;color:var(--red)}
.add-set-row{padding:10px 16px 14px;text-align:center;font-size:13px;font-weight:700;color:var(--text3);cursor:pointer;border-top:1px solid var(--border)}
.add-set-row:active{background:var(--bg3)}
.finish-btn{margin:14px 16px 6px;padding:16px;background:var(--accent);border-radius:var(--radius);text-align:center;font-size:17px;font-weight:800;color:#000;cursor:pointer}
.finish-btn:active{opacity:.85}

/* LIBRARY */
.routine-card{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);margin:0 16px 10px;padding:16px;cursor:pointer}
.routine-card:active{background:var(--bg3)}
.routine-card-top{display:flex;align-items:center;justify-content:space-between}
.routine-name{font-size:17px;font-weight:700}
.routine-meta{font-size:13px;color:var(--text2);margin-top:4px}
.routine-actions{display:flex;gap:8px}
.new-routine-btn{margin:0 16px 14px;padding:14px;border:2px dashed var(--border2);border-radius:var(--radius);text-align:center;font-size:15px;font-weight:700;color:var(--text3);cursor:pointer}
.new-routine-btn:active{background:var(--bg2)}

/* RUN LOGGER */
.run-block{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);margin:0 16px 12px;padding:18px}
.run-time-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.run-dist-row{margin-top:12px}
.run-field label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;display:block;margin-bottom:6px;text-align:center}
.run-inp{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 4px;font-size:28px;font-weight:800;color:var(--text);width:100%;text-align:center;-webkit-appearance:none;font-family:inherit;font-variant-numeric:tabular-nums}
.run-inp:focus{outline:none;border-color:var(--blue)}
.run-inp.dist{font-size:32px}
.log-run-btn{margin-top:14px;padding:14px;background:var(--blue);border-radius:var(--radius-sm);text-align:center;font-size:16px;font-weight:800;color:#fff;cursor:pointer}
.log-run-btn:active{opacity:.85}

/* HISTORY */
.filter-tabs{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto}
.filter-tabs::-webkit-scrollbar{display:none}
.ftab{padding:7px 14px;border-radius:20px;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;background:var(--bg2);border:1px solid var(--border);color:var(--text2)}
.ftab.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.hist-session{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin:0 16px 10px;overflow:hidden}
.hist-sess-hdr{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.hist-sess-title{font-size:15px;font-weight:700}
.hist-sess-date{font-size:12px;color:var(--text2)}
.hist-sess-body{padding:0 16px 14px;display:none}
.hist-sess-body.open{display:block}
.hist-ex-name{font-size:13px;font-weight:700;color:var(--text2);margin:10px 0 3px}
.hist-set-line{font-size:13px;color:var(--text3);padding:1px 0}
.chevron{transition:transform .2s}
.chevron.open{transform:rotate(180deg)}
.run-hist-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin:0 16px 10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.rhi-left .rhi-date{font-size:12px;color:var(--text2)}
.rhi-left .rhi-name{font-size:15px;font-weight:700;margin-top:2px}
.rhi-right{text-align:right}
.rhi-dist{font-size:20px;font-weight:800;color:var(--blue)}
.rhi-time{font-size:13px;color:var(--text2)}

/* CALENDAR */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:0 20px 12px}
.cal-nav-btn{width:36px;height:36px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer}
.cal-nav-btn svg{width:18px;height:18px}
.cal-month{font-size:17px;font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 16px 12px}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--text3);padding:4px 0}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--radius-xs);font-size:14px;font-weight:600;color:var(--text2);gap:2px}
.cal-day.today-cal{background:var(--accent-dim);color:var(--accent)}
.cal-day.other-month{opacity:.25}
.cal-dot{width:5px;height:5px;border-radius:50%}
.cal-dot.lift-dot{background:var(--accent)}
.cal-dot.run-dot{background:var(--blue)}

/* SETTINGS */
.settings-group{margin:0 16px 12px;background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.settings-group-lbl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:14px 16px 8px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-top:1px solid var(--border)}
.settings-lbl{font-size:15px;font-weight:500}
.s-inp{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-xs);padding:6px 10px;font-size:15px;color:var(--text);width:80px;text-align:center;-webkit-appearance:none;font-family:inherit}
.s-inp:focus{outline:none;border-color:var(--accent)}
.theme-picker{display:flex;gap:8px}
.theme-opt{padding:6px 12px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;background:var(--bg3);border:1px solid var(--border);color:var(--text2)}
.theme-opt.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.danger-lbl{color:var(--red)}

/* EDIT DAY */
.edit-ex-row{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin:0 16px 8px;display:flex;align-items:center;gap:10px;padding:12px 14px}
.drag-handle{color:var(--text3);cursor:grab;flex-shrink:0}
.drag-handle svg{width:18px;height:18px}
.edit-ex-info{flex:1;min-width:0}
.edit-ex-name{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main-toggle{font-size:11px;font-weight:700;padding:3px 8px;border-radius:12px;cursor:pointer;border:1px solid;background:transparent}
.main-toggle.is-main{color:var(--accent);border-color:var(--accent)}
.main-toggle.not-main{color:var(--text3);border-color:var(--text3)}
.rest-inline{width:52px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-xs);padding:4px 6px;font-size:13px;color:var(--text);text-align:center;font-family:inherit;-webkit-appearance:none}

/* MODALS */
.modal-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.7);display:none;align-items:flex-end}
#ex-modal{z-index:320}
.modal-overlay.visible{display:flex}
.modal-sheet{background:var(--bg2);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-height:82vh;display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
.modal-hdr{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.modal-title{font-size:17px;font-weight:800}
.modal-close{width:30px;height:30px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;cursor:pointer}
.modal-close svg{width:16px;height:16px}
.modal-search{margin:10px 16px;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;color:var(--text);width:calc(100% - 32px);-webkit-appearance:none;font-family:inherit}
.modal-search:focus{outline:none;border-color:var(--accent)}
.modal-list{overflow-y:auto;flex:1}
.modal-list::-webkit-scrollbar{display:none}
.modal-item{padding:14px 16px;border-bottom:1px solid var(--border);font-size:15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.modal-item:active{background:var(--bg3)}
.modal-item-meta{font-size:12px;color:var(--text3)}
.modal-add-row{padding:12px 16px;display:flex;gap:8px;border-top:1px solid var(--border)}
.modal-add-inp{flex:1;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-xs);font-size:15px;color:var(--text);-webkit-appearance:none;font-family:inherit}
.modal-add-inp:focus{outline:none;border-color:var(--accent)}
.modal-add-btn{padding:10px 16px;background:var(--accent);border-radius:var(--radius-xs);font-size:15px;font-weight:800;color:#000;cursor:pointer;white-space:nowrap}

/* ROUTINE BUILDER */
.routine-builder{background:var(--bg2);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-height:92vh;display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
.rb-ex-list{overflow-y:auto;flex:1;padding:8px 0}
.rb-ex-list::-webkit-scrollbar{display:none}
.rb-ex-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.rb-ex-name{flex:1;font-size:15px;font-weight:600}
.rb-rm-btn{width:28px;height:28px;border-radius:50%;background:var(--red-dim);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.rb-rm-btn svg{width:14px;height:14px;color:var(--red)}
.rb-save-btn{margin:12px 16px;padding:14px;background:var(--accent);border-radius:var(--radius-sm);text-align:center;font-size:16px;font-weight:800;color:#000;cursor:pointer}

/* DONE MODAL */
.done-modal{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center}
.done-modal.visible{display:flex}
.done-card{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);padding:32px 24px;text-align:center;max-width:320px;width:calc(100% - 48px)}
.done-emoji{font-size:52px;margin-bottom:12px}
.done-title{font-size:24px;font-weight:800;margin-bottom:8px}
.done-stats{font-size:15px;color:var(--text2);margin-bottom:24px;line-height:1.7}
.done-btn{padding:14px 40px;background:var(--accent);border-radius:var(--radius-sm);font-size:16px;font-weight:800;color:#000;cursor:pointer;display:inline-block}

/* CONFIRM */
.confirm-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
.confirm-overlay.visible{display:flex}
.confirm-card{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);padding:24px;max-width:300px;width:calc(100% - 48px);text-align:center}
.confirm-title{font-size:17px;font-weight:700;margin-bottom:8px}
.confirm-msg{font-size:14px;color:var(--text2);margin-bottom:20px;line-height:1.5}
.confirm-btns{display:flex;gap:10px}
.confirm-btn{flex:1;padding:12px;border-radius:var(--radius-xs);font-size:15px;font-weight:700;cursor:pointer}
.confirm-btn.cancel{background:var(--bg3);color:var(--text2)}
.confirm-btn.confirm-yes-style{background:var(--red);color:#fff}
.empty-state{text-align:center;padding:60px 24px;color:var(--text3)}
.empty-state h3{font-size:18px;color:var(--text2);margin-bottom:8px}
.empty-state p{font-size:14px;line-height:1.6}

/* PR BADGE */
.pr-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;color:#000;background:var(--accent);padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle}

/* CALENDAR DAY DETAIL PANEL */
.cal-day-detail{margin:0 16px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.cal-day-detail-hdr{padding:12px 16px;background:var(--accent-dim);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.cal-day-detail-title{font-size:15px;font-weight:700;color:var(--accent)}
.cal-day-detail-close{width:26px;height:26px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;cursor:pointer}
.cal-day-detail-close svg{width:14px;height:14px}
.cal-day-item{padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.cal-day-item:last-child{border-bottom:none}
.cal-day-item:active{background:var(--bg3)}
.cal-day-item-name{font-size:14px;font-weight:700}
.cal-day-item-meta{font-size:12px;color:var(--text2);margin-top:2px}

/* CLICKABLE CALENDAR DAYS */
.cal-day{cursor:pointer}
.cal-day:active{background:var(--bg4);border-radius:var(--radius-xs)}
.cal-day.selected-cal{background:var(--accent-dim);border-radius:var(--radius-xs);color:var(--accent)}

/* NAME FILTER CHIPS (second row of filter tabs) */
.name-filter-row{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;flex-wrap:nowrap}
.name-filter-row::-webkit-scrollbar{display:none}
.nftab{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;background:var(--bg3);border:1px solid var(--border);color:var(--text3)}
.nftab.active{background:var(--blue-dim);border-color:var(--blue);color:var(--blue)}

/* EXERCISE DETAIL SCREEN */
.ex-detail-hdr{padding:14px 16px 10px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--border)}
.ex-detail-session{margin:10px 16px 0;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.ex-detail-sess-hdr{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.ex-detail-sess-date{font-size:13px;font-weight:700}
.ex-detail-sess-wk{font-size:12px;color:var(--text2)}
.ex-detail-sets{padding:0 16px 12px;display:none}
.ex-detail-sets.open{display:block}
.ex-detail-set-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)}
.ex-detail-set-row:last-child{border-bottom:none}
.ex-detail-set-num{font-size:12px;font-weight:700;color:var(--text3);width:40px;flex-shrink:0}
.ex-detail-set-val{font-size:14px;font-weight:600;flex:1}
.ex-pr-row{background:var(--accent-dim);border-radius:var(--radius-sm);padding:12px 16px;margin:12px 16px 0;display:flex;gap:16px;flex-wrap:wrap}
.ex-pr-item{flex:1;min-width:80px;text-align:center}
.ex-pr-val{font-size:22px;font-weight:800;color:var(--accent)}
.ex-pr-lbl{font-size:11px;color:var(--text2);margin-top:2px}

/* PROGRESS CHART */
.ex-chart-card{margin:12px 16px 0;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.ex-chart-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ex-chart-title{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em}
.ex-chart-toggle{display:flex;gap:6px}
.ex-chart-toggle-btn{padding:4px 10px;border-radius:14px;font-size:11px;font-weight:700;cursor:pointer;background:var(--bg3);border:1px solid var(--border);color:var(--text3)}
.ex-chart-toggle-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.ex-chart-empty{padding:16px 0;text-align:center;font-size:13px;color:var(--text3)}

/* WEEKLY RECAP */
.week-recap-card{margin:0 16px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.week-recap-title{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.week-recap-stats{display:flex;gap:10px;margin-bottom:2px}
.wr-stat{flex:1;text-align:center}
.wr-val{font-size:22px;font-weight:800}
.wr-lbl{font-size:11px;color:var(--text2);margin-top:2px}
.wr-volume-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text2);padding-top:12px;margin-top:10px;border-top:1px solid var(--border)}
.wr-pr-row{font-size:13px;font-weight:700;color:var(--accent);margin-top:8px}

/* STREAK BADGE */
.streak-badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:#ff9a4f;background:rgba(255,154,79,0.12);padding:5px 12px;border-radius:20px;margin-top:8px}

/* EXERCISE NOTES */
.ex-notes-section{margin:12px 16px 0;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.ex-notes-hdr{padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between}
.ex-notes-hdr-lbl{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em}
.ex-notes-edit-btn{font-size:12px;font-weight:700;color:var(--blue);cursor:pointer}
.ex-notes-textarea{width:100%;min-height:80px;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-xs);font-size:14px;color:var(--text);font-family:inherit;resize:vertical;-webkit-appearance:none}
.ex-notes-textarea:focus{outline:none;border-color:var(--accent)}
.ex-notes-display{padding:0 16px 14px;font-size:14px;color:var(--text2);line-height:1.5;white-space:pre-wrap}
.ex-notes-empty{padding:0 16px 14px;font-size:13px;color:var(--text3);font-style:italic}
.ex-notes-save-row{display:flex;gap:8px;padding:0 16px 14px}
.ex-notes-save-btn{flex:1;padding:9px;background:var(--accent);border-radius:var(--radius-xs);text-align:center;font-size:13px;font-weight:700;color:#000;cursor:pointer}
.ex-notes-cancel-btn{padding:9px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-xs);text-align:center;font-size:13px;font-weight:700;color:var(--text2);cursor:pointer}
</style>
</head>

<!-- REST BANNER -->
<div id="rest-banner">
  <div class="rb-info">
    <div class="rb-label" id="rb-label">Rest</div>
    <div class="rb-time" id="rb-time">2:00</div>
  </div>
  <div class="rb-bar-wrap"><div class="rb-bar" id="rb-bar" style="width:100%"></div></div>
  <div class="rb-add" onclick="addRestTime(30)">+30s</div>
  <div class="rb-skip" onclick="skipRest()">Skip</div>
</div>

<!-- EXERCISE PICKER MODAL -->
<div class="modal-overlay" id="ex-modal">
  <div class="modal-sheet">
    <div class="modal-hdr">
      <span class="modal-title" id="ex-modal-title">Choose Exercise</span>
      <div class="modal-close" onclick="closeExModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    </div>
    <input class="modal-search" id="ex-search" placeholder="Search exercises…" oninput="filterEx()">
    <div class="modal-list" id="ex-list"></div>
    <div class="modal-add-row" style="flex-direction:column;align-items:stretch;gap:8px">
      <div style="display:flex;gap:8px">
        <input class="modal-add-inp" id="new-ex-inp" placeholder="Add custom exercise…">
        <div class="modal-add-btn" onclick="addCustomEx()">Add</div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);cursor:pointer;padding:2px 2px">
        <input type="checkbox" id="new-ex-cardio" style="width:16px;height:16px">
        Cardio/Erg exercise (tracks time + distance, e.g. Row Erg, Ski Erg)
      </label>
    </div>
  </div>
</div>

<!-- ROUTINE BUILDER MODAL -->
<div class="modal-overlay" id="rb-modal">
  <div class="routine-builder">
    <div class="modal-hdr">
      <span class="modal-title" id="rb-modal-title">New Routine</span>
      <div class="modal-close" onclick="closeRbModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    </div>
    <div style="padding:12px 16px 4px">
      <input id="rb-name-inp" style="width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-xs);font-size:16px;font-weight:700;color:var(--text);font-family:inherit;-webkit-appearance:none" placeholder="Routine name…">
    </div>
    <div class="rb-ex-list" id="rb-ex-list"></div>
    <div style="padding:0 16px 4px">
      <div onclick="openExModalForBuilder()" style="padding:12px;border:1.5px dashed var(--border2);border-radius:var(--radius-xs);text-align:center;font-size:14px;font-weight:700;color:var(--text3);cursor:pointer">+ Add Exercise</div>
    </div>
    <div class="rb-save-btn" onclick="saveRoutine()">Save Routine</div>
  </div>
</div>

<!-- DAY SWAP MODAL -->
<div class="modal-overlay" id="day-swap-modal">
  <div class="modal-sheet">
    <div class="modal-hdr">
      <span class="modal-title" id="day-swap-title">Change Day</span>
      <div class="modal-close" onclick="closeDaySwapModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    </div>
    <div class="modal-list" id="day-swap-list"></div>
  </div>
</div>

<!-- DONE MODAL -->
<div class="done-modal" id="done-modal">
  <div class="done-card">
    <div class="done-emoji">🔥</div>
    <div class="done-title" id="done-title">Done!</div>
    <div class="done-stats" id="done-stats"></div>
    <div class="done-btn" onclick="closeDoneModal()">Nice one</div>
  </div>
</div>

<!-- CONFIRM DIALOG -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-card">
    <div class="confirm-title" id="confirm-title">Are you sure?</div>
    <div class="confirm-msg" id="confirm-msg"></div>
    <div class="confirm-btns">
      <div class="confirm-btn cancel" onclick="closeConfirm()">Cancel</div>
      <div class="confirm-btn confirm-yes-style" id="confirm-yes">Delete</div>
    </div>
  </div>
</div>

function isValidBackupShape(data){
  return !!data && Array.isArray(data.loggedSessions) && Array.isArray(data.runHistory)
    && data.exerciseHistory && typeof data.exerciseHistory==='object';
}

function applyLoadedData(p){
  S.exerciseHistory = mergeHistory(HEVY_HISTORY, p.exerciseHistory||{});
  S.loggedSessions = p.loggedSessions || [];
  S.runHistory = p.runHistory || [];
  S.programme = p.programme || JSON.parse(JSON.stringify(DEFAULT_PROGRAMME));
  S.savedRoutines = p.savedRoutines || [];
  S.settings = {...S.settings, ...(p.settings||{})};
  S.exerciseNotes = p.exerciseNotes || {};
  S.cardioExercises = p.cardioExercises || {'Row Erg':true,'Ski Erg':true,'Assault Bike':true};
}

function seedDefaults(){
  S.exerciseHistory = JSON.parse(JSON.stringify(HEVY_HISTORY));
  S.loggedSessions = HEVY_SESSIONS.map(s => ({...s, fromHevy:true}));
  S.runHistory = [];
  S.programme = JSON.parse(JSON.stringify(DEFAULT_PROGRAMME));
  S.savedRoutines = [];
  S.exerciseNotes = {};
  S.cardioExercises = {'Row Erg':true,'Ski Erg':true,'Assault Bike':true};
}

function loadState(){
  S.dataIssueDetected = null;
  let raw = null;
  try { raw = localStorage.getItem('lift_v3'); } catch(e) {}

  if (raw) {
    let parsed=null, ok=false;
    try { parsed = JSON.parse(raw); ok = isValidBackupShape(parsed); } catch(e) { ok=false; }

    if (ok) {
      applyLoadedData(parsed);
      applyTheme(S.settings.theme);
      return;
    }

    // Primary key exists but is unreadable or malformed — try the shadow copy
    let shadowRaw=null;
    try { shadowRaw = localStorage.getItem('lift_v3_shadow'); } catch(e) {}
    if (shadowRaw) {
      try {
        const sp = JSON.parse(shadowRaw);
        if (isValidBackupShape(sp)) {
          applyLoadedData(sp);
          applyTheme(S.settings.theme);
          S.dataIssueDetected = 'recovered';
          return;
        }
      } catch(e) {}
    }

    // Both primary and shadow are unusable — this is real data loss, not first-run
    seedDefaults();
    applyTheme(S.settings.theme);
    S.dataIssueDetected = 'lost';
    return;
  }

  // No primary key at all — genuine first run, nothing to worry about
  seedDefaults();
  applyTheme(S.settings.theme);
}

function mergeHistory(base, saved){
  const merged = JSON.parse(JSON.stringify(base));
  for (const [k,v] of Object.entries(saved)) {
    if (!merged[k]) merged[k] = v;
    else {
      const baseDates = new Set(merged[k].map(s=>s.date));
      for (const s of v) if (!baseDates.has(s.date)) merged[k].push(s);
      merged[k].sort((a,b)=>new Date(b.date)-new Date(a.date));
    }
  }
  return merged;
}

function save(){
  try {
    const payload = JSON.stringify({
      exerciseHistory:S.exerciseHistory, loggedSessions:S.loggedSessions,
      runHistory:S.runHistory, programme:S.programme,
      savedRoutines:S.savedRoutines, settings:S.settings,
      exerciseNotes:S.exerciseNotes,
      cardioExercises:S.cardioExercises
    });
    // Promote the current primary to shadow BEFORE overwriting it, so shadow
    // always holds the last known-good state from before this write.
    try {
      const currentPrimary = localStorage.getItem('lift_v3');
      if (currentPrimary && isValidBackupShape(JSON.parse(currentPrimary))) {
        localStorage.setItem('lift_v3_shadow', currentPrimary);
      }
    } catch(e) {}
    localStorage.setItem('lift_v3', payload);
  } catch(e) {
    console.error('Lift: save failed', e);
  }
}

let restTimer=null, restEndAt=0, restTotal=0, restLabel='';
function startRest(secs, label){
  if (restTimer) clearInterval(restTimer);
  restTotal = secs;
  restEndAt = Date.now() + secs*1000;
  restLabel = label||'Rest';
  document.getElementById('rb-label').textContent = restLabel;
  document.getElementById('rest-banner').classList.add('visible');
  document.getElementById('view').classList.add('rest-active');
  updateRestBanner();
  restTimer = setInterval(tickRest, 1000);
}
function tickRest(){
  const remaining = Math.round((restEndAt - Date.now())/1000);
  if (remaining <= 0){
    clearInterval(restTimer); restTimer=null;
    skipRest(); beep();
    return;
  }
  updateRestBanner();
}
function updateRestBanner(){
  const remaining = Math.max(0, Math.round((restEndAt - Date.now())/1000));
  const m=Math.floor(remaining/60), s=remaining%60;
  document.getElementById('rb-time').textContent = `${m}:${p2(s)}`;
  document.getElementById('rb-bar').style.width = `${Math.max(0,(remaining/restTotal)*100)}%`;
}
function skipRest(){
  if(restTimer){clearInterval(restTimer);restTimer=null;}
  document.getElementById('rest-banner').classList.remove('visible');
  document.getElementById('view').classList.remove('rest-active');
}
function addRestTime(s){ restEndAt+=s*1000; restTotal+=s; updateRestBanner(); }
function beep(){ try{ const a=new AudioContext(),o=a.createOscillator(),g=a.createGain(); o.connect(g);g.connect(a.destination); o.frequency.value=880; g.gain.setValueAtTime(0.3,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.4); o.start();o.stop(a.currentTime+0.4);
  // Double-beep so it's noticeable even if you just glanced back at the app
  setTimeout(()=>{ try{ const a2=new AudioContext(),o2=a2.createOscillator(),g2=a2.createGain(); o2.connect(g2);g2.connect(a2.destination); o2.frequency.value=1040; g2.gain.setValueAtTime(0.3,a2.currentTime); g2.gain.exponentialRampToValueAtTime(0.001,a2.currentTime+0.35); o2.start();o2.stop(a2.currentTime+0.35);}catch(e){} },220);
}catch(e){} }
function vibrate(pattern){ try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }

// Re-sync the moment the tab/app becomes visible again (covers screen lock, app switch, etc.)
document.addEventListener('visibilitychange', ()=>{
  if (document.visibilityState === 'visible') {
    if (restTimer) {
      // Rest timer was running — recompute immediately rather than waiting for next tick
      const remaining = Math.round((restEndAt - Date.now())/1000);
      if (remaining <= 0) { clearInterval(restTimer); restTimer=null; skipRest(); beep(); vibrate([200,100,200]); }
      else updateRestBanner();
    }
    if (S.activeWorkout && S.screen==='workout') {
      // Workout elapsed timer — force an immediate refresh so it doesn't look frozen
      const el=document.getElementById('wk-elapsed');
      if (el) el.textContent = fmtDur(Math.floor((Date.now()-S.activeWorkout.startTime)/1000));
    }
  }
});

// ── STREAK & WEEKLY RECAP ──
function computeStreak(){
  const activeDates = new Set();
  S.loggedSessions.forEach(s=>{ try{ const d=new Date(s.date); activeDates.add(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`); }catch(e){} });
  S.runHistory.forEach(r=>{ try{ const d=new Date(r.date); activeDates.add(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`); }catch(e){} });
  let streak=0;
  let cursor=new Date();
  const todayKey=`${cursor.getFullYear()}-${cursor.getMonth()}-${cursor.getDate()}`;
  if(!activeDates.has(todayKey)) cursor.setDate(cursor.getDate()-1);
  while(true){
    const key=`${cursor.getFullYear()}-${cursor.getMonth()}-${cursor.getDate()}`;
    if(activeDates.has(key)){ streak++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }
  return streak;
}
function computeLongestStreak(){
  const activeDates = new Set();
  S.loggedSessions.forEach(s=>{ try{ const d=new Date(s.date); activeDates.add(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`); }catch(e){} });
  S.runHistory.forEach(r=>{ try{ const d=new Date(r.date); activeDates.add(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`); }catch(e){} });
  if(activeDates.size===0) return 0;
  const dates=[...activeDates].map(k=>{ const [y,m,d]=k.split('-').map(Number); return new Date(y,m,d).getTime(); }).sort((a,b)=>a-b);
  let longest=1, current=1;
  for(let i=1;i<dates.length;i++){
    const diff=Math.round((dates[i]-dates[i-1])/864e5);
    if(diff===1){ current++; longest=Math.max(longest,current); } else current=1;
  }
  return longest;
}
function sessionVolume(s){
  return (s.exercises||[]).reduce((a,ex)=>a+(ex.sets||[]).reduce((b,set)=>b+((set.weight||0)*(set.reps||0)),0),0);
}
function computeWeeklyRecap(){
  const now=Date.now(), weekStart=now-7*864e5, prevWeekStart=now-14*864e5;
  const inRange=(dateStr,start,end)=>{ try{ const t=new Date(dateStr).getTime(); return t>=start && t<=end; }catch(e){ return false; } };
  const thisWeekSessions=S.loggedSessions.filter(s=>inRange(s.date,weekStart,now));
  const lastWeekSessions=S.loggedSessions.filter(s=>inRange(s.date,prevWeekStart,weekStart));
  const thisWeekRuns=S.runHistory.filter(r=>inRange(r.date,weekStart,now));
  const thisWeekVolume=thisWeekSessions.reduce((a,s)=>a+sessionVolume(s),0);
  const lastWeekVolume=lastWeekSessions.reduce((a,s)=>a+sessionVolume(s),0);
  const volumeChangePct = lastWeekVolume>0 ? Math.round(((thisWeekVolume-lastWeekVolume)/lastWeekVolume)*100) : null;
  const totalDist=thisWeekRuns.reduce((a,r)=>a+parseFloat(r.distKm||0),0);
  let prCount=0;
  Object.keys(S.exerciseHistory).forEach(name=>{
    const prs=computePRs(name);
    (S.exerciseHistory[name]||[]).forEach(session=>{
      if(inRange(session.date,weekStart,now)){
        session.sets.forEach(set=>{ if(set.weight && prs.bestWeight && set.weight===prs.bestWeight) prCount++; });
      }
    });
  });
  return {
    sessionsThisWeek:thisWeekSessions.length, runsThisWeek:thisWeekRuns.length,
    totalDistThisWeek:totalDist, volumeThisWeek:thisWeekVolume, volumeChangePct, prCount
  };
}

  ${streak>0?`<div class="streak-badge">🔥 ${streak} day streak${longestStreak>streak?` <span style="opacity:0.75;font-weight:600">· best ${longestStreak}</span>`:''}</div>`:''}
  </div>`;

  // Data integrity notice — highest priority, only shows if something actually happened
  if (S.dataIssueDetected === 'recovered') {
    h+=`<div class="day-card" style="border-color:var(--orange,#ff9a4f)">
      <div class="day-card-top">
        <div class="day-label" style="color:#ff9a4f">⚠️ DATA RECOVERED</div>
        <div class="cal-day-detail-close" onclick="event.stopPropagation();S.dataIssueDetected=null;renderHome(document.getElementById('view'))"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
      </div>
      <div class="day-ex">Your saved data couldn't be read on load, so we restored it from a backup copy. Everything below should be intact — worth a quick check of your most recent session.</div>
    </div>`;
  } else if (S.dataIssueDetected === 'lost') {
    h+=`<div class="day-card" style="border-color:var(--red)">
      <div class="day-card-top">
        <div class="day-label" style="color:var(--red)">⚠️ DATA ISSUE</div>
        <div class="cal-day-detail-close" onclick="event.stopPropagation();S.dataIssueDetected=null;renderHome(document.getElementById('view'))"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
      </div>
      <div class="day-ex">We couldn't load your saved history and no backup copy was available. If you have an exported JSON file, import it from Settings to restore it.</div>
    </div>`;
  }

  // Resume banner if a workout is paused in the background
  if (S.activeWorkout && S.screen!=='workout') {
    const elapsedMin = Math.round((Date.now()-S.activeWorkout.startTime)/60000);
    const setsLogged = S.activeWorkout.exercises.reduce((a,ex)=>a+ex.sets.filter(s=>s.completed).length,0);
    h+=`<div class="day-card today" style="border-color:var(--orange,#ff9a4f);cursor:pointer" onclick="resumeWorkout()">
      <div class="day-card-top"><div class="day-label" style="color:var(--blue)">⏸ PAUSED WORKOUT</div><div class="day-badge lift">Resume ▶</div></div>
      <div class="day-name">${S.activeWorkout.name}</div>
      <div class="day-ex">${setsLogged} sets logged · ${elapsedMin} min elapsed — tap to continue</div>
    </div>`;
  }

  // Backup reminder — dismissible, only shows when meaningfully overdue
  if (shouldShowBackupReminder()) {
    const never = !S.settings.lastBackupAt;
    h+=`<div class="day-card" style="border-color:var(--blue)">
      <div class="day-card-top">
        <div class="day-label" style="color:var(--blue)">💾 BACKUP REMINDER</div>
        <div class="cal-day-detail-close" onclick="event.stopPropagation();dismissBackupReminder()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
      </div>
      <div class="day-ex">${never?"You haven't backed up yet.":"It's been a while since your last backup."} Your history only lives on this phone — export a JSON copy just in case.</div>
      <div class="log-run-btn" style="margin-top:10px;background:var(--blue)" onclick="event.stopPropagation();quickBackup()">Export Backup Now</div>
    </div>`;
  }

  h+=`<div class="week-recap-card">
    <div class="week-recap-title">This Week</div>
    <div class="week-recap-stats">
      <div class="wr-stat"><div class="wr-val">${recap.sessionsThisWeek}</div><div class="wr-lbl">Workouts</div></div>
      <div class="wr-stat"><div class="wr-val">${recap.runsThisWeek}</div><div class="wr-lbl">Runs</div></div>
      <div class="wr-stat"><div class="wr-val">${recap.totalDistThisWeek.toFixed(1)}km</div><div class="wr-lbl">Distance</div></div>
    </div>
    ${recap.volumeThisWeek>0?`<div class="wr-volume-row">
      <span>Volume: <b style="color:var(--text)">${Math.round(recap.volumeThisWeek).toLocaleString()}kg</b></span>
      ${recap.volumeChangePct!==null?`<span style="color:${recap.volumeChangePct>=0?'var(--accent)':'var(--red)'};font-weight:700">${recap.volumeChangePct>=0?'↑':'↓'} ${Math.abs(recap.volumeChangePct)}% vs last wk</span>`:''}
    </div>`:''}
    ${recap.prCount>0?`<div class="wr-pr-row">🏆 ${recap.prCount} PR${recap.prCount===1?'':'s'} this week</div>`:''}
  </div>
  <div class="section-label">Your Week</div>`;
  for(let i=0;i<7;i++){
    const prog=S.programme[i], isToday=i===progDay, isRun=prog.type==='run';
    const exText=isRun?prog.label:prog.exercises.map(e=>e.name.split('(')[0].trim()).join(' · ');
    h+=`<div class="day-card ${isToday?'today':''}" onclick="startDay(${i})">
      <div class="day-card-top"><div class="day-label ${isToday?'today-lbl':''}">${isToday?'▶ TODAY — ':''}${DAYS[i]}</div><div class="day-badge ${isRun?'run':'lift'}">${isRun?'🏃 Run':'💪 Lift'}</div></div>
      <div class="day-name">${prog.name}</div><div class="day-ex">${exText}</div>
    </div>`;
  }
  v.innerHTML=h;
}
function resumeWorkout(){
  S.screen='workout'; S.tab='home';
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-home').classList.add('active');
  startWkTimer(); render();

// ── START WORKOUT ──
function startDay(dayIdx){
  const prog=S.programme[dayIdx];
  if(prog.type==='run'){ S.screen='run'; S.runDayIdx=dayIdx; S.tab='home'; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.getElementById('tab-home').classList.add('active'); render(); return; }
  launchLift(prog.name, prog.exercises, dayIdx, null);
}
function startSavedRoutine(i){ const r=S.savedRoutines[i]; launchLift(r.name, r.exercises, null, i); }
function launchLift(name, templates, dayIdx, routineIdx){
  const exercises = templates.map(ex=>{
    const hist=S.exerciseHistory[ex.name];
    let sets=[];
    if(hist&&hist.length>0){
      const last=[...hist].sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
      sets=last.sets.map(s=>({weight:s.weight??null,reps:s.reps??null,duration:s.duration??null,completed:false}));
    } else {
      sets=[{weight:null,reps:null,completed:false},{weight:null,reps:null,completed:false},{weight:null,reps:null,completed:false}];
    }
    return {...ex, sets};
  });
  S.activeWorkout={name,dayIdx,routineIdx,startTime:Date.now(),exercises};
  S.screen='workout'; S.tab='home';
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-home').classList.add('active');
  startWkTimer(); render();
}

// ── ACTIVE WORKOUT ──
function renderWorkout(v){
  const {name,startTime,exercises}=S.activeWorkout;
  let h=`<div class="wk-header">
    <div class="back-btn" onclick="cancelWorkout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></div>
    <div class="wk-title-wrap"><div class="wk-main-title">${name}</div><div class="wk-day-label">In progress</div></div>
    <div class="wk-timer" id="wk-elapsed">${fmtDur(Math.floor((Date.now()-startTime)/1000))}</div>
  </div>`;
  exercises.forEach((ex,ei)=>{
    const hist=S.exerciseHistory[ex.name];
    const sorted=hist?[...hist].sort((a,b)=>new Date(b.date)-new Date(a.date)):[];
    const prev=sorted.length>1?sorted[1]:(sorted.length===1?sorted[0]:null);
    const isDur=ex.sets[0]&&ex.sets[0].duration!==undefined&&ex.sets[0].weight===null&&ex.sets[0].reps===null;
    const isCardio = !!S.cardioExercises[ex.name];
    if(prev&&prev.sets.length>0){
      h+=`<div class="prev-banner"><div class="prev-lbl">Previous · ${prev.date}</div><div class="prev-chips">${prev.sets.map(s=>{
        let t;
        if(isCardio) t=`${s.cardioDist||0}m in ${fmtMS(s.cardioTime||0)}`;
        else t=s.duration?`${s.duration}s`:s.weight?`${s.weight}kg×${s.reps}`:`${s.reps} reps`;
        return `<div class="prev-chip">${t}</div>`;
      }).join('')}</div></div>`;
    }
    const hasNote = !!S.exerciseNotes[ex.name];
    h+=`<div class="ex-block" id="ex-${ei}">
      <div class="ex-header">
        <div class="ex-header-info"><div class="ex-name" style="cursor:pointer" onclick="openExDetail('${ex.name.replace(/'/g,"\\'")}')">${ex.name} <span style="font-size:11px;color:var(--blue);font-weight:600">▶</span>${hasNote?'<span style="font-size:11px;color:var(--accent);margin-left:4px">📝</span>':''}</div><div class="ex-meta">${ex.isMain?'Main · ':''}Rest ${ex.restSeconds||90}s${isCardio?' · Cardio':''}</div></div>
        <div class="ex-actions"><div class="icon-btn" onclick="swapEx(${ei})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></div></div>
      </div>
      <div class="sets-head"><span>#</span>${isCardio?'<span>Time</span><span>Metres</span>':isDur?'<span>Secs</span><span></span>':'<span>kg</span><span>Reps</span>'}<span></span><span></span></div>`;
    ex.sets.forEach((set,si)=>{
      const done=set.completed;
      const prevSet = si>0 ? ex.sets[si-1] : null;
      const canRepeat = prevSet && !done && (prevSet.weight!=null || prevSet.reps!=null || prevSet.duration!=null || prevSet.cardioTime!=null || prevSet.cardioDist!=null);
      h+=`<div class="set-row ${done?'done-row':''}" id="sr-${ei}-${si}"><div class="set-num ${canRepeat?'set-num-tap':''}" ${canRepeat?`onclick="repeatSet(${ei},${si})"`:''}>${si+1}</div>`;
      if(isCardio){
        h+=`<input class="set-inp" id="inp-ct-${ei}-${si}" type="text" inputmode="numeric" value="${set.cardioTime?fmtMS(set.cardioTime):''}" placeholder="m:ss" ${done?'readonly':''} onfocus="this.select()" oninput="updCardioTime(${ei},${si},this.value)">
        <input class="set-inp" id="inp-cd-${ei}-${si}" type="number" inputmode="numeric" value="${set.cardioDist??''}" placeholder="metres" ${done?'readonly':''} onfocus="this.select()" oninput="updCardioDist(${ei},${si},this.value)">`;
      } else if(isDur){
        h+=`<input class="set-inp" id="inp-d-${ei}-${si}" type="number" inputmode="numeric" value="${set.duration??''}" placeholder="0" ${done?'readonly':''} onfocus="this.select()" oninput="updDur(${ei},${si},this.value)"><div></div>`;
      } else {
        h+=`<input class="set-inp" id="inp-w-${ei}-${si}" type="number" inputmode="decimal" step="0.5" enterkeyhint="next" value="${set.weight??''}" placeholder="—" ${done?'readonly':''} onfocus="this.select()" oninput="updW(${ei},${si},this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();const r=document.getElementById('inp-r-${ei}-${si}');if(r)r.focus();}">
        <input class="set-inp" id="inp-r-${ei}-${si}" type="number" inputmode="numeric" enterkeyhint="done" value="${set.reps??''}" placeholder="—" ${done?'readonly':''} onfocus="this.select()" oninput="updR(${ei},${si},this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">`;
      }
      h+=`<div class="tick-btn ${done?'done':''}" id="tick-${ei}-${si}" onclick="tickSet(${ei},${si})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="del-set-btn" onclick="delSet(${ei},${si})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div></div>`;
    });
    h+=`<div class="add-set-row" onclick="addSet(${ei})">+ Add ${isCardio?'Interval':'Set'}</div></div>`;
  });
  h+=`<div class="finish-btn" onclick="finishWorkout()">Finish Workout ✓</div><div style="height:8px"></div>`;
  v.innerHTML=h; startWkTimer();
}

function repeatSet(ei,si){
  const ex = S.activeWorkout.exercises[ei];
  const prev = ex.sets[si-1];
  if(!prev) return;
  const set = ex.sets[si];
  set.weight = prev.weight ?? set.weight;
  set.reps = prev.reps ?? set.reps;
  set.duration = prev.duration ?? set.duration;
  set.cardioTime = prev.cardioTime ?? set.cardioTime;
  set.cardioDist = prev.cardioDist ?? set.cardioDist;
  renderWorkout(document.getElementById('view'));
}

function fmtMS(totalSeconds){
  const m=Math.floor(totalSeconds/60), s=Math.round(totalSeconds%60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}
function parseMS(str){
  if(!str) return 0;
  if(str.includes(':')){
    const [m,s]=str.split(':').map(Number);
    return (m||0)*60+(s||0);
  }
  return parseFloat(str)||0;
}

function updW(ei,si,val){ S.activeWorkout.exercises[ei].sets[si].weight=val===''?null:parseFloat(val); }
function updR(ei,si,val){ S.activeWorkout.exercises[ei].sets[si].reps=val===''?null:parseInt(val); }
function updDur(ei,si,val){ S.activeWorkout.exercises[ei].sets[si].duration=val===''?null:parseFloat(val); }
function updCardioTime(ei,si,val){ S.activeWorkout.exercises[ei].sets[si].cardioTime=parseMS(val); }
function updCardioDist(ei,si,val){ S.activeWorkout.exercises[ei].sets[si].cardioDist=val===''?null:parseFloat(val); }

function tickSet(ei,si){
  const set=S.activeWorkout.exercises[ei].sets[si];
  set.completed=!set.completed;
  const row=document.getElementById(`sr-${ei}-${si}`), tick=document.getElementById(`tick-${ei}-${si}`);
  if(set.completed){
    row.classList.add('done-row'); tick.classList.add('done');
    ['inp-w-','inp-r-','inp-d-'].forEach(p=>{const el=document.getElementById(p+`${ei}-${si}`);if(el)el.setAttribute('readonly',true);});
    const ex=S.activeWorkout.exercises[ei];
    startRest(ex.restSeconds||(ex.isMain?S.settings.mainRestSeconds:S.settings.accessoryRestSeconds), `Rest — ${ex.name}`);
  } else {
    row.classList.remove('done-row'); tick.classList.remove('done');
    ['inp-w-','inp-r-','inp-d-'].forEach(p=>{const el=document.getElementById(p+`${ei}-${si}`);if(el)el.removeAttribute('readonly');});
  }
}
function addSet(ei){
  const ex=S.activeWorkout.exercises[ei], last=ex.sets[ex.sets.length-1];
  ex.sets.push({weight:last?.weight??null,reps:last?.reps??null,duration:last?.duration??null,completed:false});
  renderWorkout(document.getElementById('view'));
  setTimeout(()=>{ const el=document.getElementById(`ex-${ei}`); if(el) el.scrollIntoView({behavior:'smooth',block:'end'}); },80);
}
function delSet(ei,si){
  if(S.activeWorkout.exercises[ei].sets.length<=1) return;
  S.activeWorkout.exercises[ei].sets.splice(si,1);
  renderWorkout(document.getElementById('view'));
}
function swapEx(ei){
  openExModal('Swap Exercise',(name)=>{
    const ex=S.activeWorkout.exercises[ei]; ex.name=name;
    const hist=S.exerciseHistory[name];
    if(hist&&hist.length>0){ const last=[...hist].sort((a,b)=>new Date(b.date)-new Date(a.date))[0]; ex.sets=last.sets.map(s=>({weight:s.weight??null,reps:s.reps??null,duration:s.duration??null,completed:false})); }
    renderWorkout(document.getElementById('view'));
  });
}
function cancelWorkout(){ showConfirm('Cancel Workout','Progress will be lost.',()=>{ S.activeWorkout=null;S.screen=null;stopWkTimer();skipRest();render(); }); }
function finishWorkout(){
  const {name,startTime,exercises}=S.activeWorkout;
  const durMins=Math.round((Date.now()-startTime)/60000);
  const dateStr=new Date().toLocaleString('en-AU',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  exercises.forEach(ex=>{
    const completed=ex.sets.filter(s=>s.completed);
    if(completed.length>0){
      if(!S.exerciseHistory[ex.name]) S.exerciseHistory[ex.name]=[];
      S.exerciseHistory[ex.name].unshift({date:dateStr,workoutName:name,sets:completed.map((s,i)=>({setIndex:i,type:'normal',weight:s.weight,reps:s.reps,duration:s.duration}))});
    }
  });
  const totalSets=exercises.reduce((a,ex)=>a+ex.sets.filter(s=>s.completed).length,0);
  S.loggedSessions.unshift({date:dateStr,workoutName:name,durationMins:durMins,exercises:exercises.map(ex=>({name:ex.name,sets:ex.sets.filter(s=>s.completed).map(s=>({weight:s.weight,reps:s.reps,duration:s.duration}))}))});
  save();
  S.activeWorkout=null; S.screen=null; stopWkTimer(); skipRest();
  document.getElementById('done-title').textContent=`${name} Done! 🔥`;
  document.getElementById('done-stats').innerHTML=`${totalSets} sets · ${durMins} min`;
  document.getElementById('done-modal').classList.add('visible');
}
function closeDoneModal(){ document.getElementById('done-modal').classList.remove('visible'); nav('home'); }

  let h=`<div class="wk-header">

    <div class="wk-title-wrap"><div class="wk-main-title">${prog.name}</div><div class="wk-day-label">${prog.label}</div></div>
  </div><div style="height:14px"></div>
  <div class="run-block">
    <div class="ex-name" style="margin-bottom:4px">Log Today's Run</div>
    <div style="font-size:13px;color:var(--text3);margin-bottom:2px">Time</div>
    <div class="run-time-row">
      <div class="run-field"><label>Hours</label><input class="run-inp" id="r-h" type="number" inputmode="numeric" min="0" max="23" placeholder="0"></div>
      <div class="run-field"><label>Minutes</label><input class="run-inp" id="r-m" type="number" inputmode="numeric" min="0" max="59" placeholder="00"></div>

function logRun(){
  const h=parseInt(document.getElementById('r-h').value)||0;
  const m=parseInt(document.getElementById('r-m').value)||0;
  const s=parseInt(document.getElementById('r-s').value)||0;
  const dist=parseFloat(document.getElementById('r-d').value);
  if(!dist||(h===0&&m===0&&s===0)){ alert('Please enter distance and time.'); return; }
  const totalSecs=h*3600+m*60+s;
  const timeStr=h>0?`${h}:${p2(m)}:${p2(s)}`:`${m}:${p2(s)}`;
  let pace='';
  if(dist>0){ const ps=totalSecs/dist; pace=`${Math.floor(ps/60)}:${p2(Math.round(ps%60))}`; }
  const dateStr=new Date().toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
  S.runHistory.unshift({date:dateStr,name:S.programme[S.runDayIdx].name,distKm:dist.toFixed(2),timeStr,pace,totalSecs});
  save();
  document.getElementById('done-title').textContent='Run Logged! 🏃';
  document.getElementById('done-stats').innerHTML=`${dist.toFixed(2)} km in ${timeStr}${pace?`<br>Pace: ${pace}/km`:''}`;
  document.getElementById('done-modal').classList.add('visible');
  S.screen=null;
}

// ── PR DETECTION ──
function computePRs(exName){
  // Returns { bestWeight, bestReps, bestVolume } across all sessions
  const hist = S.exerciseHistory[exName] || [];
  let bestWeight=0, bestReps=0, bestVolume=0;
  hist.forEach(session=>{
    session.sets.forEach(set=>{
      const w = set.weight||0, r = set.reps||0;
      if(w > bestWeight) bestWeight=w;
      if(r > bestReps) bestReps=r;
      const vol = w*r;
      if(vol > bestVolume) bestVolume=vol;
    });
  });
  return {bestWeight, bestReps, bestVolume};
}
function isPR(exName, set){
  // Is this set a PR compared to all previous sessions (not including current)?
  const hist = S.exerciseHistory[exName] || [];
  if(hist.length < 2) return false; // need at least one prior session
  const prior = hist.slice(1); // skip the most recent (which is current session)
  let prevBestWeight=0, prevBestVol=0;
  prior.forEach(session=>{
    session.sets.forEach(s=>{
      const w=s.weight||0, r=s.reps||0;
      if(w > prevBestWeight) prevBestWeight=w;
      if(w*r > prevBestVol) prevBestVol=w*r;
    });
  });
  const w=set.weight||0, r=set.reps||0;
  return (w > prevBestWeight) || (w*r > prevBestVol && w > 0 && r > 0);
}

// ── PROGRESS CHART ──
let exChartMetric = 'volume'; // 'weight' | 'volume' — only used for weighted exercises

function buildExerciseChart(name, metric){
  const hist=(S.exerciseHistory[name]||[]).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  const pts=[];
  hist.forEach(session=>{
    let val=null;
    if(metric==='weight'){ const w=session.sets.map(s=>s.weight||0).filter(x=>x>0); if(w.length) val=Math.max(...w); }
    else if(metric==='volume'){ const v=session.sets.reduce((a,s)=>a+((s.weight||0)*(s.reps||0)),0); if(v>0) val=v; }
    else if(metric==='reps'){ const r=session.sets.map(s=>s.reps||0).filter(x=>x>0); if(r.length) val=Math.max(...r); }
    else if(metric==='duration'){ const d=session.sets.map(s=>s.duration||0).filter(x=>x>0); if(d.length) val=Math.max(...d); }
    else if(metric==='distance'){ const d=session.sets.map(s=>s.cardioDist||0).filter(x=>x>0); if(d.length) val=d.reduce((a,b)=>a+b,0); }
    if(val!==null && val>0) pts.push({date:session.date, val});
  });
  if(pts.length<2) return null;

  const W=100,H=40,padL=2,padR=2,padT=6,padB=6;
  const vals=pts.map(p=>p.val);
  const maxV=Math.max(...vals), minV=Math.min(...vals);
  const range=(maxV-minV)||1;
  const n=pts.length;
  const xStep=(W-padL-padR)/(n-1);
  const coords=pts.map((p,i)=>({
    x: padL+i*xStep,
    y: padT+(H-padT-padB)*(1-(p.val-minV)/range),
    val:p.val
  }));
  const pathD=coords.map((c,i)=>`${i===0?'M':'L'}${c.x.toFixed(2)},${c.y.toFixed(2)}`).join(' ');
  const areaD=pathD+` L${coords[n-1].x.toFixed(2)},${H-padB} L${coords[0].x.toFixed(2)},${H-padB} Z`;
  const dots=coords.map((c,i)=>`<circle cx="${c.x.toFixed(2)}" cy="${c.y.toFixed(2)}" r="${i===n-1?2.2:1.2}" fill="${i===n-1?'var(--accent)':'var(--blue)'}"/>`).join('');

  const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:90px;display:block" preserveAspectRatio="none">
    <path d="${areaD}" fill="var(--accent)" opacity="0.1"/>
    <path d="${pathD}" fill="none" stroke="var(--accent)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    ${dots}
  </svg>`;
  return {svg, first:pts[0], last:pts[n-1], min:minV, max:maxV};
}

function fmtMetricVal(metric,val){
  if(metric==='duration') return `${Math.round(val)}s`;
  if(metric==='distance') return `${Math.round(val)}m`;
  if(metric==='weight') return `${val}kg`;
  if(metric==='volume') return `${Math.round(val).toLocaleString()}kg`;
  if(metric==='reps') return `${Math.round(val)}`;
  return val;
}

function renderExerciseChartCard(name){
  const hist=S.exerciseHistory[name]||[];
  const isCardioEx=!!S.cardioExercises[name];
  let hasWeight=false,hasDuration=false,hasReps=false;
  hist.forEach(s=>s.sets.forEach(set=>{
    if(set.weight) hasWeight=true;
    if(set.duration) hasDuration=true;
    if(set.reps) hasReps=true;
  }));

  let metric, title, showToggle=false;
  if(isCardioEx){ metric='distance'; title='Distance per Session'; }
  else if(hasWeight){ metric=exChartMetric; title=exChartMetric==='weight'?'Max Weight':'Total Volume'; showToggle=true; }
  else if(hasDuration){ metric='duration'; title='Max Hold Time'; }
  else if(hasReps){ metric='reps'; title='Max Reps'; }
  else return '';

  const chart=buildExerciseChart(name,metric);
  const toggleHTML=showToggle?`<div class="ex-chart-toggle">
    <div class="ex-chart-toggle-btn ${exChartMetric==='weight'?'active':''}" onclick="setExChartMetric('weight')">Weight</div>
    <div class="ex-chart-toggle-btn ${exChartMetric==='volume'?'active':''}" onclick="setExChartMetric('volume')">Volume</div>
  </div>`:'';

  if(!chart){
    return `<div class="ex-chart-card">
      <div class="ex-chart-hdr"><div class="ex-chart-title">${title}</div>${toggleHTML}</div>
      <div class="ex-chart-empty">Log a couple more sessions to see a trend</div>
    </div>`;
  }

  return `<div class="ex-chart-card">
    <div class="ex-chart-hdr"><div class="ex-chart-title">${title}</div>${toggleHTML}</div>
    <div id="ex-chart-svg-wrap">${chart.svg}</div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-top:2px">
      <span>${chart.first.date}</span><span>${chart.last.date}</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-top:2px;font-weight:600">
      <span>Low: ${fmtMetricVal(metric,chart.min)}</span><span>Peak: ${fmtMetricVal(metric,chart.max)}</span>
    </div>
  </div>`;
}

function exportData(format){
  const date=new Date().toISOString().slice(0,10);
  let content, filename, mime;

  if(format==='json'){
    content=JSON.stringify({loggedSessions:S.loggedSessions,runHistory:S.runHistory,exerciseHistory:S.exerciseHistory,exerciseNotes:S.exerciseNotes},null,2);
    filename=`lift-export-${date}.json`; mime='application/json';
    S.settings.lastBackupAt = Date.now();
    S.settings.lastBackupSessionCount = S.loggedSessions.length;
    save();

  } else if(format==='csv'){
    // Workouts CSV — one row per set
    const rows=[['Date','Workout','Exercise','Set','Weight (kg)','Reps','Duration (s)']];
    S.loggedSessions.forEach(session=>{
      (session.exercises||[]).forEach(ex=>{
        (ex.sets||[]).forEach((set,si)=>{
          rows.push([
            `"${session.date}"`,
            `"${session.workoutName}"`,
            `"${ex.name}"`,
            si+1,
            set.weight??'',
            set.reps??'',
            set.duration??''
          ]);
        });
      });
    });
    content=rows.map(r=>r.join(',')).join('\n');
    filename=`lift-workouts-${date}.csv`; mime='text/csv';

  } else if(format==='runs-csv'){
    const rows=[['Date','Run Name','Distance (km)','Time','Pace (min/km)']];
    S.runHistory.forEach(r=>{
      rows.push([`"${r.date}"`,`"${r.name}"`,r.distKm,`"${r.timeStr}"`,`"${r.pace||''}"`]);
    });
    content=rows.map(r=>r.join(',')).join('\n');
    filename=`lift-runs-${date}.csv`; mime='text/csv';

  } else if(format==='hevy-csv'){
    // HEVY-compatible CSV format
    const rows=[['title','start_time','end_time','description','exercise_title','superset_id','exercise_notes','set_index','set_type','weight_kg','reps','distance_km','duration_seconds','rpe']];
    S.loggedSessions.forEach(session=>{
      const start=session.date||'';
      const end=session.date||'';
      (session.exercises||[]).forEach(ex=>{
        (ex.sets||[]).forEach((set,si)=>{
          rows.push([
            `"${session.workoutName}"`,start,end,'',
            `"${ex.name}"`,
            '','',si,'normal',
            set.weight??'',set.reps??'','','',
            set.duration??'',''
          ]);
        });
      });
    });
    content=rows.map(r=>r.join(',')).join('\n');
    filename=`lift-hevy-export-${date}.csv`; mime='text/csv';
  }

  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}
function shouldShowBackupReminder(){
  const {lastBackupAt, lastBackupSessionCount, backupReminderDismissedAt} = S.settings;
  const now = Date.now();
  if (backupReminderDismissedAt && (now - backupReminderDismissedAt) < 3*864e5) return false;
  const sessionsSince = S.loggedSessions.length - (lastBackupSessionCount||0);
  if (!lastBackupAt) return S.loggedSessions.length >= 3;
  const daysSince = (now - lastBackupAt) / 864e5;
  return daysSince >= 14 || sessionsSince >= 8;
}
function dismissBackupReminder(){
  S.settings.backupReminderDismissedAt = Date.now();
  save();
  renderHome(document.getElementById('view'));
}

function restoreFromShadow(){
  let shadowRaw=null;
  try { shadowRaw = localStorage.getItem('lift_v3_shadow'); } catch(e) {}
  if (!shadowRaw) { alert('No safety copy found yet — one gets created automatically after your first couple of saves.'); return; }
  let parsed;
  try { parsed = JSON.parse(shadowRaw); } catch(e) { alert('The safety copy appears to be corrupted too.'); return; }
  if (!isValidBackupShape(parsed)) { alert('The safety copy doesn\'t look valid.'); return; }
  showConfirm(
    'Restore From Safety Copy?',
    'This replaces your current data with the last known-good backup. Anything logged since that point will be lost. Only do this if your data currently looks wrong or incomplete.',
    ()=>{
      localStorage.setItem('lift_v3', shadowRaw);
      loadState();
      render();
      alert('Restored from safety copy.');
    }
  );
}

// ── IMPORT ──
function handleImportFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let data;
    try {
      data = JSON.parse(e.target.result);
    } catch(err) {
      alert('Could not read that file — it doesn\'t look like a valid Lift JSON export.');
      event.target.value = '';
      return;
    }
    if(!data.loggedSessions && !data.runHistory && !data.exerciseHistory){
      alert('This file doesn\'t contain recognisable Lift data.');
      event.target.value = '';
      return;
    }
    const newSessions = (data.loggedSessions||[]).length;
    const newRuns = (data.runHistory||[]).length;
    showConfirm(
      'Import Backup?',
      `This file contains ${newSessions} workout session(s) and ${newRuns} run(s). They'll be merged into your existing history (duplicates by date are skipped). This won't delete anything.`,
      ()=>{ doImport(data); }
    );
    event.target.value = '';
  };
  reader.readAsText(file);
}

function doImport(data){
  let addedSessions=0, addedRuns=0, addedNotes=0;

  // Merge logged sessions (skip exact date+name duplicates)
  if(data.loggedSessions){
    const existingKeys = new Set(S.loggedSessions.map(s=>s.date+'|'+s.workoutName));
    data.loggedSessions.forEach(s=>{
      const key = s.date+'|'+s.workoutName;
      if(!existingKeys.has(key)){
        S.loggedSessions.push(s);
        existingKeys.add(key);
        addedSessions++;
      }
    });
    S.loggedSessions.sort((a,b)=>new Date(b.date)-new Date(a.date));
  }

  // Merge run history
  if(data.runHistory){
    const existingRunKeys = new Set(S.runHistory.map(r=>r.date+'|'+r.name+'|'+r.distKm));
    data.runHistory.forEach(r=>{
      const key = r.date+'|'+r.name+'|'+r.distKm;
      if(!existingRunKeys.has(key)){
        S.runHistory.push(r);
        existingRunKeys.add(key);
        addedRuns++;
      }
    });
    S.runHistory.sort((a,b)=>new Date(b.date)-new Date(a.date));
  }

  // Merge exercise history (per-exercise, by date)
  if(data.exerciseHistory){
    S.exerciseHistory = mergeHistory(S.exerciseHistory, data.exerciseHistory);
  }

  // Merge notes (only fill in ones we don't already have, don't overwrite)
  if(data.exerciseNotes){
    Object.entries(data.exerciseNotes).forEach(([k,v])=>{
      if(!S.exerciseNotes[k]){ S.exerciseNotes[k]=v; addedNotes++; }
    });
  }

  save();
  document.getElementById('done-title').textContent='Import Complete ✓';
  document.getElementById('done-stats').innerHTML=`${addedSessions} workout(s) added<br>${addedRuns} run(s) added${addedNotes?`<br>${addedNotes} note(s) added`:''}`;
  document.getElementById('done-modal').classList.add('visible');
  renderSettings(document.getElementById('view'));
}

// ── EXERCISE MODAL ──
function openExModal(title,cb){
  S.exModalCallback=cb;
  document.getElementById('ex-modal-title').textContent=title;
  document.getElementById('ex-search').value='';
  document.getElementById('ex-modal').classList.add('visible');
  populateExList('');
  setTimeout(()=>document.getElementById('ex-search').focus(),100);
}
function closeExModal(){ document.getElementById('ex-modal').classList.remove('visible'); S.exModalCallback=null; }
function filterEx(){ populateExList(document.getElementById('ex-search').value); }
function populateExList(q){
  const all=Object.keys(S.exerciseHistory).sort();
  const filtered=q?all.filter(n=>n.toLowerCase().includes(q.toLowerCase())):all;
  document.getElementById('ex-list').innerHTML=filtered.map(n=>`<div class="modal-item" onclick="selectEx('${n.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')"><span>${n}</span><span class="modal-item-meta">${(S.exerciseHistory[n]||[]).length} sessions</span></div>`).join('');
}
function selectEx(name){ if(S.exModalCallback) S.exModalCallback(name); closeExModal(); }
function addCustomEx(){
  const name=document.getElementById('new-ex-inp').value.trim();
  if(!name) return;
  const isCardio=document.getElementById('new-ex-cardio').checked;
  if(!S.exerciseHistory[name]) S.exerciseHistory[name]=[];
  if(isCardio) S.cardioExercises[name]=true;
  save();
  selectEx(name);
  document.getElementById('new-ex-inp').value='';
  document.getElementById('new-ex-cardio').checked=false;
}
document.getElementById('ex-modal').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeExModal(); });
document.getElementById('rb-modal').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeRbModal(); });

// ── CONFIRM ──
let confirmCb=null;
function showConfirm(title,msg,cb){ confirmCb=cb; document.getElementById('confirm-title').textContent=title; document.getElementById('confirm-msg').textContent=msg; document.getElementById('confirm-overlay').classList.add('visible'); }
function closeConfirm(){ document.getElementById('confirm-overlay').classList.remove('visible'); confirmCb=null; }
document.getElementById('confirm-yes').addEventListener('click',()=>{ if(confirmCb) confirmCb(); closeConfirm(); });

// ── INIT ──
loadState();
render();
</script>
